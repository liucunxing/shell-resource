    if(!ver(t.version)?.published)throw Error('该版本尚未发布，不能确认');
    if(departmentItems(t.version,t.sector,t.dept).some(c=>!v19RawSubmitted(t.version,c.id)||v19RawSubmitted(t.version,c.id).requiresResubmission))throw Error('部门项目尚未全部提交，不能统一确认');
    const rows=t.revisions.map(r=>({r,c:cat(t.version).find(c=>c.id===r.id),s:v19RawSubmitted(t.version,r.id)}));
    if(!rows.length||rows.some(({r,c,s})=>!c?.enabled||c.sector!==t.sector||c.dept!==t.dept||!s||s.revision!==r.revision||s.requiresResubmission||v19Confirmed(t.version,r.id)))throw Error('提交快照已变化，请关闭后重新确认');
    const at=now(),batch='CONF-'+Date.now();
    rows.forEach(({s})=>{s.departmentConfirmation={revision:s.revision,by:curUser().name,userId:st.user,at,batch,sector:t.sector,dept:t.dept};});
    log(`${t.version} / ${t.sector} / ${t.dept}：${curUser().name} 确认 ${rows.length} 个已提交方案，向最高管理层开放`);
    st.v19ConfirmTarget=null;persist();close();render();toast('已确认；最高管理层现在可查看，Owner 已锁定');
  }
  function releaseDialog(v=st.version,sector=st.sector,dept=st.dept){
    if(!mayReview(sector,dept))return;
    const rows=departmentItems(v,sector,dept).filter(c=>v19Confirmed(v,c.id));
    if(!rows.length){toast('该部门没有已确认方案');return;}
    st.v19ReleaseTarget={...targetScope(v,sector,dept),revisions:rows.map(c=>({id:c.id,revision:v19RawSubmitted(v,c.id).revision}))};
    modal('撤回部门确认',`<p><b>${esc(v)} · ${esc(sector)} / ${esc(dept)}</b></p><p>将撤回 ${rows.length} 个 Initiative 的部门确认，最高管理层不再展示这批分配数据。Owner 已提交内容保持不变，可直接再次统一确认。需要修改时，请另外按 Owner 退回，或退回全部 Owner。</p><p class="tiny">仅撤回不会开放 Owner 修改。退回修改仍受版本开放状态与截止时间控制。</p><label class="field">撤回原因（必填）<input id="v19-release-reason" maxlength="160" placeholder="说明撤回部门确认的原因"></label><div id="formerror" class="negative" role="alert"></div>`, '<button data-action="close">取消</button><button class="primary" data-v19-workflow="release">撤回部门确认</button>');
  }
  function releaseDepartment(){
    const t=st.v19ReleaseTarget,reason=$('#v19-release-reason')?.value.trim();
    if(!t||!mayReview(t.sector,t.dept))throw Error('当前身份没有此部门的开放权限');
    if(!reason)throw Error('请填写撤回原因');
    const rows=t.revisions.map(r=>({r,s:v19RawSubmitted(t.version,r.id)}));
    if(rows.some(({r,s})=>!s||s.revision!==r.revision||!v19Confirmed(t.version,r.id)))throw Error('确认状态已变化，请关闭后重试');
    db.confirmationHistory=db.confirmationHistory||[];
    rows.forEach(({r,s})=>{
      db.confirmationHistory.push({version:t.version,id:r.id,confirmation:clone(s.departmentConfirmation),releasedBy:curUser().name,releasedAt:now(),reason});
      delete s.departmentConfirmation;
    });
    log(`${t.version} / ${t.sector} / ${t.dept}：${curUser().name} 撤回 ${rows.length} 个确认（保留 Owner 提交）；${reason}`);
    st.v19ReleaseTarget=null;persist();close();render();toast('已撤回部门确认，Owner 提交保留；可再次确认或按 Owner 退回修改');
  }
  const editableBefore=editable;
  editable=function(){
    if(st.role!=='owner'){toast('仅 Initiative Owner 可以修改本人方案');return false;}
    if(!own().some(c=>c.id===st.id)){toast('当前项目不属于本人负责范围');return false;}
    if(v19Confirmed(st.version,st.id)){toast('部门已确认，当前方案只读；请部门负责人撤回确认并退回该 Owner 后修改');return false;}
    if(window.V19DepartmentCenter?.ownerLocked(st.version,st.id)){toast('方案已提交；需部门负责人退回该 Owner 开放修改');return false;}
    return editableBefore();
  };
  const validateBefore=validate;
  validate=function(c,d){
    const errors=validateBefore(c,d);
    if(v19Confirmed(st.version,c.id))errors.unshift('部门已确认，需先撤回确认并退回该 Owner 后修改或重新提交');
    const allowed=activeReasons();
    if(d.reserves.some(r=>r.amount>0&&!allowed.includes(r.reason)))errors.push('请为每笔预留选择有效的后台配置原因');
    return [...new Set(errors)];
  };
  const submitDialogBefore=submitDialog;
  submitDialog=function(ids){
    if(st.role!=='owner'){toast('仅 Initiative Owner 可以提交');return;}
    const available=ids.filter(id=>!v19Confirmed(st.version,id));
    if(!available.length){toast('所选项目已全部确认，无需重复提交');return;}
    submitDialogBefore(available);
    const layer=$('#layer');if(layer)layer.innerHTML=layer.innerHTML.replaceAll('提交后进入管理层组合','提交后由部门负责人确认').replaceAll('Owner草稿与管理层提交快照独立','Owner 草稿与提交快照独立；部门确认后最高管理层才可见');
  };
  const doSubmitBefore=doSubmit;
  doSubmit=function(ids){
    if(st.role!=='owner'||!ids.length||ids.some(id=>!own().some(c=>c.id===id)))throw Error('只能提交本人负责的 Initiative');
    for(const id of ids){const c=cat().find(c=>c.id===id),errors=validate(c,draft(st.version,id));if(errors.length)throw Error(c.name+'：'+errors.join('；'));}
    doSubmitBefore(ids);
    ids.forEach(id=>{const s=v19RawSubmitted(st.version,id);delete s.departmentConfirmation;delete s.requiresResubmission;delete s.returnReason;delete draft(st.version,id).returnReason;});
    persist();
  };
  const badgeBefore=statusBadge;
  statusBadge=function(c){
    const s=v19RawSubmitted(st.version,c.id);
    if(v19Confirmed(st.version,c.id))return '<span class="pill green" title="部门负责人已确认，最高管理层可见；当前项目只读">已确认 · 只读</span>';
    if(s?.requiresResubmission)return '<span class="pill warn" title="已撤回部门确认，需重新提交">待重新提交</span>';
    if(s&&businessSnapshot(s)===businessSnapshot(draft(st.version,c.id)))return `<span class="pill warn" title="第 ${s.revision} 次提交快照，等待部门负责人确认">已提交 · 待确认</span>`;
    return badgeBefore(c);
  };
  const budgetBefore=budgetStep;
  budgetStep=function(c,d){
    const template=document.createElement('template');template.innerHTML=budgetBefore(c,d);
    template.content.querySelectorAll('input[data-reason]').forEach(input=>{
      const value=d.reserves[Number(input.dataset.reason)]?.reason||'',allowed=activeReasons(),select=document.createElement('select');
      select.dataset.reason=input.dataset.reason;select.setAttribute('aria-label','预留原因');select.disabled=input.disabled;
      select.innerHTML='<option value="">请选择预留原因</option>'+(!allowed.includes(value)&&value?`<option value="${esc(value)}" selected disabled>${esc(value)}（已停用或未配置，请重选）</option>`:'')+allowed.map(name=>`<option value="${esc(name)}" ${name===value?'selected':''}>${esc(name)}</option>`).join('');
      input.replaceWith(select);
    });
    return template.innerHTML;
  };
  function reasonUse(name){return [...Object.values(db.drafts),...Object.values(db.submissions)].filter(d=>(d.reserves||[]).some(r=>r.reason===name)).length;}
  const orgBefore=adminOrg;
  adminOrg=function(){
    ensure();return orgBefore()+`<div class="panel" id="v19-reserve-config"><div class="panelhead"><div><h2>预留原因</h2><p class="sub">Owner 只能从启用的原因中选择。已使用的原因保留名称，可停用；历史记录保持原样。</p></div></div><div class="tablewrap"><table><thead><tr><th>原因</th><th>状态</th><th>已使用的草稿 / 提交快照</th><th>操作</th></tr></thead><tbody>${db.org.reserveReasons.map((r,i)=>{const used=reasonUse(r.name);return `<tr><td>${esc(r.name)}</td><td><span class="pill ${r.enabled?'green':'gray'}">${r.enabled?'启用':'停用'}</span></td><td>${used}</td><td><div class="row"><button class="small" data-v19-reason-toggle="${i}">${r.enabled?'停用':'启用'}</button><button class="small" data-v19-reason-edit="${i}" ${used?'disabled title="已被使用，请停用后新增其他原因"':''}>编辑</button><button class="small" data-v19-reason-delete="${i}" ${used?'disabled title="已被使用，不能删除"':''}>删除</button></div></td></tr>`;}).join('')}</tbody></table></div><div class="row" style="margin-top:12px"><input id="v19-new-reason" maxlength="80" placeholder="新增预留原因" aria-label="新增预留原因"><button class="small" data-v19-workflow="add-reason">＋ 添加原因</button></div></div>`;
  };
  versionForm=function(){
    if(!isAdmin())return;
    const sources=db.versions.filter(v=>v.published).sort((a,b)=>b.id.localeCompare(a.id));
    modal('从上版创建独立规划版本',`<div class="formgrid"><label class="field">版本号（YYYYMM）<input id="vid" maxlength="6" placeholder="例如202702"></label><label class="field">版本名称<input id="vname" maxlength="50" placeholder="例如预算更新版本"></label><label class="field full">复制来源<select id="vbase">${sources.map(v=>`<option value="${esc(v.id)}">${esc(v.id)} · ${esc(v.name)}</option>`).join('')}</select></label></div><div class="notice">自动带入来源版本同一 Initiative 的已提交经销商名单、金额、预留原因与逐家说明，作为待核对草稿。未提交修改不带入；提交状态和部门确认不继承。新版本先配置，再发布并开放提交。</div><div id="formerror" class="negative" role="alert"></div>`, '<button data-action="close">取消</button><button class="primary" data-action="saveversion">创建并带入上版内容</button>');
  };
  saveVersion=function(){
    if(!isAdmin())throw Error('只有管理员可以创建版本');
    const id=$('#vid').value.trim(),name=$('#vname').value.trim(),base=$('#vbase').value;
    if(!/^20\d{2}(0[1-9]|1[0-2])$/.test(id)||!name)throw Error('请输入有效 YYYYMM 版本号和名称');
    if(ver(id))throw Error('版本号已存在');
    if(!ver(base)?.published||id<=base)throw Error('新版本须晚于所选已发布来源版本');
    const v={id,name,base,open:false,published:false,catalog:clone(cat(base)),inheritance:{sourceVersion:base,createdAt:now(),createdBy:curUser().name,copied:0,withoutSubmission:0}};
    db.versions.push(v);db.versions.sort((a,b)=>a.id.localeCompare(b.id));
    v.catalog.filter(c=>c.enabled).forEach(c=>{
      const s=v19RawSubmitted(base,c.id);
      if(!s){v.inheritance.withoutSubmission++;return;}
      db.drafts[key(id,c.id)]={selected:clone(s.selected||[]),amounts:clone(s.amounts||{}),reserves:clone(s.reserves||[]),notes:clone(s.notes||{}),method:s.method||'',ack:false,status:'待核对上版方案',savedAt:'',changeReason:'',inheritedFrom:{version:base,revision:s.revision,budget:s.budget,copiedAt:now()}};
      v.inheritance.copied++;
    });
    st.version=id;st.adminTab='catalog';log(`从 ${base} 创建 ${id}：带入 ${v.inheritance.copied} 个已提交方案为待核对草稿，${v.inheritance.withoutSubmission} 个项目无已提交来源；未自动提交或确认`);
    persist();close();render();toast(`新版本已创建，带入 ${v.inheritance.copied} 个已提交方案，请配置并发布`);
  };
  const versionsBefore=adminVersions;
  adminVersions=function(){
    ensure();const groups=[];
    db.versions.forEach(v=>{const names=[...new Set(v.catalog.filter(c=>v19Confirmed(v.id,c.id)).map(c=>JSON.stringify([c.sector,c.dept])))];names.forEach(n=>{const [sector,dept]=JSON.parse(n),rows=departmentItems(v.id,sector,dept).filter(c=>v19Confirmed(v.id,c.id));groups.push({v,sector,dept,rows});});});
    return versionsBefore()+`<div class="panel"><div class="panelhead"><div><h2>部门确认与开放修改</h2><p class="sub">确认按版本、部门保存。撤回部门确认不解锁 Owner，已有提交仍保留，可直接再次确认；只有退回修改后，相关 Owner 才需重新提交。</p></div></div>${groups.length?`<div class="tablewrap"><table><thead><tr><th>版本</th><th>Sector / 部门</th><th>已确认 Initiative</th><th>操作</th></tr></thead><tbody>${groups.map(g=>`<tr><td>${esc(g.v.id)}</td><td>${esc(g.sector)} / ${esc(g.dept)}</td><td>${g.rows.length}</td><td><button class="small" data-v19-release-version="${esc(g.v.id)}" data-v19-release-sector="${esc(g.sector)}" data-v19-release-dept="${esc(g.dept)}">撤回部门确认</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="emptyinline">尚无部门已确认方案。</div>'}</div>`;
  };
  function departmentBar(){
    if(!mayReview(st.sector,st.dept))return '';
    const all=departmentItems(),confirmed=all.filter(c=>v19Confirmed(st.version,c.id)),todo=all.filter(c=>eligible(c)),missing=all.length-confirmed.length-todo.length;
    return `<div class="v19-confirm-bar" id="v19-confirm-bar"><div><strong>部门确认</strong><span class="tiny">${esc(st.version)} · ${esc(st.sector)} / ${esc(st.dept)}</span><div class="v19-confirm-counts"><span class="pill green">已确认 ${confirmed.length}</span><span class="pill warn">待确认 ${todo.length}</span><span class="pill gray">未提交 / 待重提 ${missing}</span></div></div><div class="row"><button class="primary" data-v19-workflow="confirm-dialog" ${todo.length&&ver().published?'':'disabled'}>确认本部门方案${todo.length?'（'+todo.length+'）':''}</button><button class="small" data-v19-workflow="release-dialog" ${confirmed.length?'':'disabled'}>撤回部门确认</button></div></div>`;
  }
  function disableConfirmedControls(){
    if(st.role!=='owner'||st.view!=='work'||!(v19Confirmed(st.version,st.id)||window.V19DepartmentCenter?.ownerLocked(st.version,st.id)))return;
    $('#main')?.querySelectorAll('[data-money],[data-note],[data-reserve],[data-reason],[data-select],#ack,#changeReason,[data-adopt2],[data-remove],[data-delreserve],[data-ux-undoimport],[data-action="addreserve"],[data-action="addfiltered"],[data-action="library"],[data-action="rosterup"],[data-action="moneyup"],[data-action="balance"],[data-action="undotrial"],[data-action="copyprev"],[data-action="save"],[data-action="submitone"]').forEach(e=>e.disabled=true);
  }
  function executiveCopy(value){
    return value.replace(/(?:部门)?已提交(方案|口径|快照)/g,'部门已确认$1').replaceAll('已提交','已确认').replaceAll('未提交','未确认');
  }
  function businessCopyTokens(){
    // Status vocabulary may also occur inside an Owner's note or a configured name.
    // Those values are business content, not system labels, and must remain verbatim.
    const values=new Set(),add=value=>{if(typeof value==='string'&&/已提交|未提交/.test(value))values.add(value);};
    const addRecord=record=>{
      if(!record)return;
      for(const field of ['name','owner','sector','dept','type','reason','changeReason','returnReason','method'])add(record[field]);
      Object.values(record.notes||{}).forEach(add);
      (record.reserves||[]).forEach(r=>add(r.reason));
    };
    db.versions.forEach(v=>{add(v.name);v.catalog.forEach(addRecord);});
    Object.values(db.drafts).forEach(addRecord);Object.values(db.submissions).forEach(addRecord);
    (db.users||[]).forEach(u=>{add(u.name);add(u.account);});
    SEED.dealers.forEach(addRecord);
    return [...values];
  }
  function decorateExecutiveCopy(root){
    if(st.role!=='exec'||!root)return;
    const protectedValues=businessCopyTokens(),isBusiness=value=>protectedValues.some(original=>value.includes(original));
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
    while((node=walker.nextNode())){
      if(node.parentElement?.closest('script,style,textarea,input,[contenteditable="true"]'))continue;
      if(isBusiness(node.nodeValue||''))continue;
      const value=executiveCopy(node.nodeValue||'');if(value!==node.nodeValue)node.nodeValue=value;
    }
    root.querySelectorAll('[title],[aria-label],[data-definition]').forEach(el=>{
      for(const attr of ['title','aria-label','data-definition'])if(el.hasAttribute(attr)){const original=el.getAttribute(attr);if(isBusiness(original))continue;const value=executiveCopy(original);if(value!==original)el.setAttribute(attr,value);}
    });
  }
  function decorate(){
    const main=$('#main');if(!main)return;
    if(st.role==='dept'){
      const anchor=main.querySelector('.versionstrip')||main.querySelector('.pagehead');
      anchor?.insertAdjacentHTML('afterend',departmentBar());
      for(const b of main.querySelectorAll('[data-project]')){const c=cat().find(c=>c.id===b.dataset.project),row=b.closest('tr');if(c&&row){const cell=[...row.cells].find(td=>td.querySelector('.pill')&&/已提交|未提交/.test(td.textContent));if(cell)cell.innerHTML=`<span class="pill ${v19Confirmed(st.version,c.id)?'green':'gray'}">${state(c)}</span>`;}}
    }
    if(st.role==='exec'){
      const visible=scopeConfig(),confirmed=visible.filter(c=>v19Confirmed(st.version,c.id)).length;
      const node=document.createElement('div');node.className='v19-exec-confirmed';node.textContent=`部门已确认快照 · ${confirmed} / ${visible.length} 个 Initiative 已确认；其余仅展示配置预算，分配数据暂不公开。`;
      (main.querySelector('.versionstrip')||main.querySelector('.pagehead'))?.after(node);
      decorateExecutiveCopy(main);
    }
    if(st.role==='owner'&&st.view==='work'){
      const c=currentConfig(),d=current(),s=v19RawSubmitted(st.version,st.id),locked=v19Confirmed(st.version,st.id),anchor=main.querySelector('.work-version')||main.querySelector('.pagehead');
      if(locked){const a=s.departmentConfirmation;anchor?.insertAdjacentHTML('afterend',`<div class="notice v19-workflow-note"><b>部门已确认 · 当前项目只读</b>　${esc(a.by)} · ${esc(a.at)}<br>最高管理层查看提交 V${s.revision}。如需修改，请部门负责人先撤回确认，再退回该 Owner。${businessSnapshot(s)!==businessSnapshot(d)?'<br>当前草稿含未提交修改，已保留；这些修改未进入已确认快照。':''}</div>`);}
      else if(s?.requiresResubmission)anchor?.insertAdjacentHTML('afterend',`<div class="notice yellow v19-workflow-note"><b>已退回，请修改后重新提交</b><br>${esc(s.returnReason)}</div>`);
      else if(d.inheritedFrom){const f=d.inheritedFrom,delta=pending(c,d);anchor?.insertAdjacentHTML('afterend',`<div class="notice v19-workflow-note"><b>已带入 ${esc(f.version)} · 提交 V${f.revision}</b>　请核对名单、金额和预留原因后重新提交。<br>当前${delta<0?'超预算':'待分配'} ¥ ${fmt(Math.abs(delta))}；预算变化不会自动缩放上版金额。</div>`);}
      disableConfirmedControls();
    }
    if(st.role==='owner'&&st.view==='submit')for(const b of main.querySelectorAll('[data-open]')){const c=cat().find(c=>c.id===b.dataset.open),row=b.closest('tr');if(c&&row){row.cells[5].innerHTML=statusBadge(c);if(v19Confirmed(st.version,c.id))b.textContent='只读查看';}}
    if(st.role==='admin'&&st.adminTab==='catalog'&&ver()?.inheritance){const i=ver().inheritance;main.querySelector('.pagehead')?.insertAdjacentHTML('afterend',`<div class="notice v19-workflow-note">来源 ${esc(i.sourceVersion)} · 已带入 ${i.copied} 个已提交方案，${i.withoutSubmission} 个项目无已提交来源。配置预算变化后，差额留待 Owner 核对。</div>`);}
  }
  const renderBefore=render;render=function(){ensure();const result=renderBefore();decorate();return result;};
  const refreshBefore=refreshTable;refreshTable=function(){const result=refreshBefore();disableConfirmedControls();decorateExecutiveCopy($('#main'));return result;};
  const modalBefore=modal;modal=function(...args){const result=modalBefore(...args);decorateExecutiveCopy($('#layer'));return result;};
  // Some existing drilldowns append labels after opening a modal; keep those labels consistent too.
  const executiveCopyObserver=new MutationObserver(()=>{if(st.role==='exec'){decorateExecutiveCopy($('#main'));decorateExecutiveCopy($('#layer'));}});
  for(const root of [$('#main'),$('#layer')])if(root)executiveCopyObserver.observe(root,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['title','aria-label','data-definition']});
  const seedBefore=seedDemo;seedDemo=function(){if(st.demo)return;seedBefore();ensure();db.versions.forEach(v=>{v.open=v.id==='202701';});};
  const helpBefore=help;help=function(){helpBefore();const layer=$('#layer');if(layer)layer.innerHTML=layer.innerHTML.replace('最高管理层看全部已提交方案','最高管理层仅看部门已确认的提交快照；部门确认后 Owner 只读，撤回确认只保留提交；按 Owner 退回后才可重新填报');};
  window.addEventListener('change',e=>{
    const x=e.target;if(x.dataset?.reason===undefined)return;
    e.stopImmediatePropagation();
    if(!editable()){render();return;}
    if(x.value&&!activeReasons().includes(x.value)){toast('请选择后台配置的有效预留原因');render();return;}
    const r=current().reserves[Number(x.dataset.reason)];if(r){r.reason=x.value;mark();}
  },true);
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const d=b.dataset,action=d.v19Workflow;
    if(!(action||d.v19ReasonToggle!==undefined||d.v19ReasonDelete!==undefined||d.v19ReasonEdit!==undefined||d.v19ReleaseVersion||d.togglever||d.publish))return;
    e.preventDefault();e.stopImmediatePropagation();
    try{
      if(action==='confirm-dialog'){confirmDialog();return;}
      if(action==='confirm'){confirmDepartment();return;}
      if(action==='release-dialog'){releaseDialog();return;}
      if(action==='release'){releaseDepartment();return;}
      if(d.v19ReleaseVersion){releaseDialog(d.v19ReleaseVersion,d.v19ReleaseSector,d.v19ReleaseDept);return;}
      if(!isAdmin())throw Error('只有管理员可以修改配置');
      if(d.togglever){
        const v=ver(d.togglever);if(!v)return;
        if(!v.open){if(!v.published)throw Error('请先发布配置，再开放提交');if(closedByTime(v))throw Error('已到截止时间，请先调整截止时间');db.versions.forEach(x=>{x.open=x.id===v.id;});log(v.id+' 开放提交；其他版本已关闭修改');}
        else{v.open=false;log(v.id+' 关闭提交');}
        persist();render();return;
      }
      if(d.publish){
        const v=ver(d.publish);if(!v)return;
        if(v.published&&db.versions.filter(x=>x.published).length===1)throw Error('至少保留一个已发布版本');
        v.published=!v.published;if(!v.published)v.open=false;
        log(v.id+(v.published?' 发布配置；可在版本页开放提交':' 撤回发布并关闭提交'));persist();render();return;
      }
      if(action==='add-reason'){
        const name=$('#v19-new-reason').value.trim();if(!name)throw Error('请输入预留原因');if(db.org.reserveReasons.some(r=>r.name===name))throw Error('该原因已存在');db.org.reserveReasons.push({name,enabled:true});log('预留原因：新增 '+name);
      }else if(d.v19ReasonToggle!==undefined){
        const r=db.org.reserveReasons[Number(d.v19ReasonToggle)];if(!r)return;if(r.enabled&&activeReasons().length===1)throw Error('至少保留一个启用的原因');r.enabled=!r.enabled;log('预留原因：'+(r.enabled?'启用 ':'停用 ')+r.name);
      }else if(d.v19ReasonDelete!==undefined){
        const i=Number(d.v19ReasonDelete),r=db.org.reserveReasons[i];if(!r)return;if(reasonUse(r.name))throw Error('该原因已被使用，只能停用');if(r.enabled&&activeReasons().length===1)throw Error('至少保留一个启用的原因');db.org.reserveReasons.splice(i,1);log('预留原因：删除 '+r.name);
      }else if(d.v19ReasonEdit!==undefined){
        const i=Number(d.v19ReasonEdit),r=db.org.reserveReasons[i];if(!r||reasonUse(r.name))throw Error('已使用的原因不能改名，请停用后新增');st.v19EditReason=i;modal('编辑预留原因',`<label class="field">原因名称<input id="v19-reason-name" maxlength="80" value="${esc(r.name)}"></label><div id="formerror" class="negative" role="alert"></div>`, '<button data-action="close">取消</button><button class="primary" data-v19-workflow="save-reason">保存</button>');return;
      }else if(action==='save-reason'){
        const r=db.org.reserveReasons[st.v19EditReason],name=$('#v19-reason-name').value.trim();if(!r||reasonUse(r.name))throw Error('原因状态已变化，请重试');if(!name||db.org.reserveReasons.some((x,i)=>i!==st.v19EditReason&&x.name===name))throw Error('名称不能为空或重复');log('预留原因：'+r.name+' → '+name);r.name=name;close();
      }
      persist();render();
    }catch(err){formError(err);}
  },true);
  ensure();
  // Page entry defaults to the active version; later renders preserve an explicitly selected history version.
  const entryVersion=db.versions.filter(v=>v.published&&v.open&&!closedByTime(v)).sort((a,b)=>b.id.localeCompare(a.id))[0];
  if(entryVersion)st.version=entryVersion.id;
})();

</script>

<script>

  histCompare=function(x){

    const rows=[['历史投资总额（K$）',h.investment==null?'—':kd(h.investment)],['Yield（C3 ÷ 投资）',ratioText(h.c3,h.investment)],['历史资源占比',percent(pctValue(h.investment,totalInvestment))],[ML()+(basis==='vol'?'（KL）':'（K$）'),h[basis]==null?'—':basis==='vol'?fmt(h.vol):kd(h.c3)],['合同量（KL）',h.contract==null?'—':fmt(h.contract)],['Phasing',percent(pctValue(h.vol,h.contract))],...expenseFields.filter(([k])=>allowed(k)).map(([k,label])=>[label+'（K$）',h[k]==null?'—':kd(h[k])])];

  };

  balTable=function(data,o){

    const tot={a:sum(data.map(r=>r.a)),f:sum(data.map(r=>r.f)),n:sum(data.map(r=>r.n)),investment:sum(data.map(r=>r.hInvestment||0)),c3:sum(data.map(r=>r.hC3||0))},avgAll=tot.f?tot.a/tot.f:0;

    const investmentCell=r=>r.hInvestment==null?'—':kd(r.hInvestment);
    const currentHeaders=[o.countHead,'投资金额（万）','客均（万）','投资占比','投资 − '+metricLabel,'占比对照','判断',...extras];
    const actualClass=metric=>'v19-g-actual'+(metric==='vol'?' v19-group-start':'')+(basis===metric?' v19-selected-metric':'');
    return `<div class="tablewrap"><table class="sdtab2 baltab v19-grouped-summary" data-v19-period="${st.period}" data-v19-basis="${basis}">
      <thead><tr class="v19-summary-groups"><th rowspan="2">${o.keyHead}</th><th colspan="${currentHeaders.length}" class="v19-g-current">${groupNames[0]}</th><th colspan="2" class="v19-g-actual">${groupNames[1]} · ${esc(PL(st.period))}</th><th colspan="3" class="v19-g-history">${groupNames[3]} · ${esc(PL(st.period))}</th></tr>
      <tr>${currentHeaders.map((label,index)=>`<th class="${[5,6].includes(index)?'':'num '}v19-g-current">${label}</th>`).join('')}<th class="num ${actualClass('vol')}">Delivery Vol 占比</th><th class="num ${actualClass('c3')}">C3 占比</th><th class="num v19-g-history v19-group-start">投资总额（K$）</th><th class="num v19-g-history">Yield</th><th class="num v19-g-history">历史资源占比</th></tr></thead>
      <tbody>${data.map(r=>{const metric=basis==='vol'?r.sv:r.sc,g=r.sa-metric,l=lv(Math.abs(g),G);return `<tr data-balrow="${esc(r.key)}" data-g="${r1(g)}" class="${o.active===r.key?'cur':''}"><td>${o.nameCell(r)}</td>
        <td class="num v19-g-current">${r.f} / ${r.n}</td><td class="num v19-g-current" data-summary-column="amount"><b>${wan(r.a)}</b></td><td class="num v19-g-current">${wan(r.avg)}</td><td class="num v19-g-current">${percent(r.sa)}</td><td class="num v19-g-current" style="color:${Math.abs(g)>G[0]?lvc(l):'inherit'}">${pf(g)}</td><td class="v19-g-current"><div class="v19-share-pair"><span>投入 ${percent(r.sa)}</span><span>${metricLabel} ${percent(metric)}</span></div></td><td class="v19-g-current">${l==='good'?sig('good','匹配'):sig(l,g>0?'投资偏多':'投资偏少')}</td>${extraCells(r)}
        <td class="num ${actualClass('vol')}" data-summary-column="actual-vol">${percent(r.sv)}</td><td class="num ${actualClass('c3')}" data-summary-column="actual-c3">${percent(r.sc)}</td>
        
        <td class="num v19-g-history v19-group-start" data-summary-column="history-investment">${investmentCell(r)}</td><td class="num v19-g-history" data-summary-column="history-yield">${ratioText(r.hC3,r.hInvestment)}</td><td class="num v19-g-history" data-summary-column="history-share">${percent(r.hShare)}</td></tr>`;}).join('')}

    const ids = [...new Set(items.map(i => i.id).filter(Boolean))];
    const snapshots = base && ver(base) ? ids.map(id => submitted(base, id)).filter(Boolean) : [];
    const previousIds = new Set(base && ver(base) ? cat(base).filter(i=>i.enabled).map(i=>i.id) : []);
    const visibleIds = new Set(snapshots.map(i=>i.id));
    // A genuinely new Initiative has a zero baseline; an existing but unsubmitted one has no usable baseline.
    const available = !!(base && ver(base) && ids.length && ids.every(id=>!previousIds.has(id)||visibleIds.has(id)));
    return {version: base || '', items: snapshots, available, ids};
  }
  function fluctuation(now, before, available) {
    if (!available || !finite(before)) return {value: null, label: '无基期', state: 'missing'};
    if (Number(before) === 0) return Number(now) > 0 ? {value: null, label: '新增', state: 'new'} : {value: null, label: '无基期', state: 'zero'};
    const value = (Number(now) - Number(before)) / Number(before);
    return {value, label: (value > 0 ? '+' : '') + fmt(value * 100, 1) + '%', state: 'comparable'};
  }
  window.V19SelectionScope = {rows: selectionRows, currentItems, currentRows: () => selectionRows(currentItems()), baseline, fluctuation};

  // These wrappers only preserve the business scope. Historical period remains owned by V19LocalHistory.
  const oldGroupPanel = groupPanel;
  groupPanel = function(c, d, ...args) { return withScope([{...c, ...d, included:true}], st.version, () => oldGroupPanel(c, d, ...args)); };
  const oldDealerPanel = dealerPanel;
  dealerPanel = function(groups, items, ...args) { return withScope(items, st.version, () => oldDealerPanel(groups, items, ...args)); };
  const oldProjectDetail = projectDetail;
  projectDetail = function(id, version = st.version, ...args) {
    const item = (version === st.version ? boardItems() : scoped(version)).find(i => i.id === id);
    return withScope(item?.included ? [item] : [], version, () => oldProjectDetail(id, version, ...args));
  };
  const oldGroupDetail = groupDetail;
  groupDetail = function(id, ...args) {
    const group = groupsOf(boardItems()).find(g => g.key === id);
    return withScope(group?.inc || [], st.version, () => oldGroupDetail(id, ...args));
  };
  const oldDealerDetail = dealerDetail;
  dealerDetail = function(id, ...args) {
    let items=itemsForDrawer();
    const target=window.event?.target;
    const scopeKey=[st.user,st.role,st.view,st.version,st.id,st.ownerSector,st.ownerDept,st.sector,st.dept,st.execType,st.deptIni].join('|');
    const replay=!!target?.closest?.('[data-local-period],[data-local-basis]');
    if(replay&&savedDealerScope?.key===scopeKey&&savedDealerScope.id===id)items=savedDealerScope.items;
    else if(target?.closest?.('#layer')&&!target.closest('[data-cohort-dealer-open]')&&curD?.t==='project'){
      const item=boardItems().find(i=>i.id===curD.id);items=item?.included?[item]:[];
    }
    if(typeof id==='string'&&!id.startsWith('@'))savedDealerScope={id,key:scopeKey,items};
    const previousItems=itemsForDrawer;itemsForDrawer=()=>items;
    try{return withScope(items,st.version,()=>oldDealerDetail(id,...args));}finally{itemsForDrawer=previousItems;}
  };

  const oldUnified = unifiedTable;
  unifiedTable = function(rows, amounts, edit, items, ...args) {
    const scopedItems = Array.isArray(items) ? items : currentItems();
    const selected = selectionRows(scopedItems);
    const html = oldUnified(selected, amounts, edit, scopedItems, ...args);
    const t = document.createElement('template'); t.innerHTML = html;
    const table = t.content.querySelector('.unified');
    if (table) { table.dataset.selectionCount = String(selected.length); table.dataset.selectionIds = selected.map(x => x.id).join(','); }
    const foot = t.content.querySelector('.tablefoot');
    if (foot) foot.insertAdjacentHTML('afterbegin', `<span class="v19-selection-note">分母：当前业务范围已勾选的 ${selected.length} 家经销商（跨 Initiative 去重，包含已勾选但未获配的经销商）。</span>`);
    return t.innerHTML.replaceAll('全量经销商', '当前勾选名单');
  };
  const oldTableData = tableData;
  tableData = function(rows, amounts, items, ...args) {
    const allowed = new Set(selectionRows(items || currentItems()).map(x => x.id));
    const unique = [...new Map(rows.filter(x => x && allowed.has(x.id)).map(x => [x.id, x])).values()];
    const result = oldTableData(unique, amounts, items, ...args);
    // Weighted totals are ratios of the displayed aggregate inputs, never averages of individual rates.
    result.totals.phasing = ratioValue(sumField(unique, 'vol'), sumField(unique, 'contract'));
    if (!yieldAligned()) result.totals.yield = null;
    return result;
  };
  histCompare = function(x) {
    const h = hist(x), scope = selectionRows(currentItems()), investment = sumField(scope, 'investment');
    const included = scope.some(d => d.id === x.id), basis = st.hBasis;
    const fields = V19DataViews.expenseFields;
    const rows = [
      ['历史投资总额（K$）', finite(h.investment) ? kd(h.investment) : '—'],
      ['Yield（C3 ÷ 投资）', !yieldAligned() || ratioValue(h.c3, h.investment) == null ? '—' : v20YieldRatio(h.c3,h.investment)],
      ['历史资源占比', included ? percent(h.investment, investment) : '未勾选'],
      [ML() + (basis === 'vol' ? '（KL）' : '（K$）'), finite(h[basis]) ? (basis === 'vol' ? fmt(h.vol) : kd(h.c3)) : '—'],
      ['合同量（KL）', finite(h.contract) ? fmt(h.contract) : '—'],
      ['Phasing', percent(h.vol, h.contract)],
      ...fields.filter(([field]) => V19DataViews.allowed(field)).map(([field, name]) => [name + '（K$）', finite(h[field]) ? kd(h[field]) : '—'])
    ];
    return `<table class="mini histcmp" data-v19-history="${st.period}" data-selection-count="${scope.length}" data-selection-ids="${scope.map(d=>d.id).join(',')}"><thead><tr><th>指标</th><th class="num">${esc(PL(st.period))}</th></tr></thead><tbody>${rows.map(([label,n])=>`<tr><td>${label}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table><div class="tiny2">历史资源占比分母为当前业务范围勾选名单的并集（${scope.length} 家），包含未获配经销商；搜索、排序和分页不改变分母。${st.period==='2026YTD'?'YTD 与全年覆盖时间不同，不能直接判断同比。':''}${yieldAligned()?'':yieldMismatch}</div>`;
  };

  const oldBalData = balData;
  balData = function(universe, listRows, amounts, group) {
    const selected = [...new Map((listRows || []).filter(Boolean).map(x=>[x.id,x])).values()];
    const previous = baseline();
    const previousAmounts = combine(previous.items);
    const previousRows = selectionRows(previous.items);
    const stats = oldBalData(selected, selected, amounts, group);
    // Retain former groups with zero current dealers so the full baseline and -100% exits remain visible.
    if (previous.available) for (const name of new Set(previousRows.map(x=>x[group]))) {
      if (!stats.some(r=>r.key===name)) stats.push({key:name,n:0,f:0,a:0,ids:[],sa:total(selected.map(x=>amounts[x.id]||0))>0?0:null,sv:null,sc:null,avg:0,gv:null,gc:null,g:null,noCurrentSelection:true});
    }
    const historicalInvestment = sumField(selected, 'investment');
    return stats.map(row => {
      const local = selected.filter(x => x[group] === row.key);
      // The previous SD/RSM investment uses its full former selection, including dealers removed this version.
      const before = previous.available ? total(previousRows.filter(x => x[group] === row.key).map(x => previousAmounts[x.id] || 0)) : null;
      const contract = sumField(local, 'contract'), vol = sumField(local, 'vol'), c3 = sumField(local, 'c3'), investment = sumField(local, 'investment');
      return {...row, hContract:contract, hVol:vol, hC3:c3, hInvestment:investment,
        hPhasing:ratioValue(vol,contract), hShare:ratioValue(investment,historicalInvestment)==null?null:investment/historicalInvestment*100,
        previousInvestment:before, baselineVersion:previous.version, baselineAvailable:previous.available,
        fluctuation:fluctuation(row.a,before,previous.available)};
    });
  };
  function cell(tag, name, text, className, raw) {
    const node = document.createElement(tag); node.dataset.summaryColumn = name; node.className = className; node.textContent = text;
    if (raw != null) node.dataset.value = String(raw); return node;
  }
  function historicalCells(row, tag = 'td') {
    const defs = [['contract','合同量（KL）',row?.hContract],['delivery-vol','实际 Delivery Vol（KL）',row?.hVol],['c3-total','C3（K$）',row?.hC3],['phasing','Phasing',row?.hPhasing]];
    return defs.map(([name,label,n],index) => {
      const text = tag==='th'?label:!finite(n)?'—':name==='phasing'?fmt(n*100,1)+'%':name==='c3-total'?kd(n):fmt(n);
      return cell(tag,name,text,'num v19-g-actual'+(index===0?' v19-group-start':'')+((name==='delivery-vol'&&st.hBasis==='vol')||(name==='c3-total'&&st.hBasis==='c3')?' v19-selected-metric':''),tag==='th'?null:n);
    });
  }
  const oldBalTable = balTable;
  balTable = function(data, options, ...args) {
    const o = {...options, countHead: (options.countHead || '获配 / 名单').replace('全部','名单')};
    const t = document.createElement('template'); t.innerHTML = oldBalTable(data,o,...args);
    const table = t.content.querySelector('.v19-grouped-summary'); if (!table) return t.innerHTML;
    table.classList.add('v19-confirmed-metrics');
    const groupHead=table.tHead.rows[0], header=table.tHead.rows[1];
    if (window.V19HistoryMetadata && periodSlot()==='ytd') {
      const coverage=V19HistoryMetadata.coverage(),actual=coverage.find(d=>d.id==='actual'),expenses=coverage.find(d=>d.id==='expenses');
      if(actual)groupHead.querySelector('.v19-g-actual').textContent='历史 Actual · 截至 '+actual.latestMonth;
      if(expenses)groupHead.querySelector('.v19-g-history').textContent='历史投资 · 截至 '+expenses.latestMonth;
    }
    groupHead.querySelector('.v19-g-current').colSpan += 2;
    groupHead.querySelector('.v19-g-actual').colSpan += 4;
    const actualHead=header.querySelector('.v19-g-actual');
    header.insertBefore(cell('th','previous-investment','上版投资（万）','num v19-g-current'),actualHead);
    header.insertBefore(cell('th','investment-fluctuation','波动率','num v19-g-current'),actualHead);
    const insertedHeader=historicalCells(null,'th'); insertedHeader.forEach(node=>header.insertBefore(node,actualHead));
    actualHead.classList.remove('v19-group-start');
    const sumNullable=field=>data.some(r=>finite(r[field]))?total(data.map(r=>r[field])):null;
    const totals={hContract:sumNullable('hContract'),hVol:sumNullable('hVol'),hC3:sumNullable('hC3'),a:total(data.map(r=>r.a)),previousInvestment:sumNullable('previousInvestment')};
    totals.hPhasing=ratioValue(totals.hVol,totals.hContract);
    const available=data.some(r=>r.baselineAvailable), versions=[...new Set(data.map(r=>r.baselineVersion).filter(Boolean))];
    const allRows=[...table.tBodies[0].rows];
    for(const tr of allRows){
      const r=tr.classList.contains('totalrow')?totals:data.find(x=>x.key===tr.dataset.balrow);if(!r)continue;
      const firstActual=tr.querySelector('[data-summary-column="actual-vol"]');if(!firstActual)continue;
      const change=tr.classList.contains('totalrow')?fluctuation(r.a,r.previousInvestment,available):r.fluctuation;
      const prior=cell('td','previous-investment',finite(r.previousInvestment)?wan(r.previousInvestment):'—','num v19-g-current',r.previousInvestment);
      const rate=cell('td','investment-fluctuation',change.label,'num v19-g-current',change.value);
      rate.dataset.baselineState=change.state;rate.title=`(本版投资 − 上版投资) ÷ 上版投资${versions.length?'；来源版本 '+versions.join(' / '):''}`;
      tr.insertBefore(prior,firstActual);tr.insertBefore(rate,firstActual);
      historicalCells(r).forEach(node=>tr.insertBefore(node,firstActual));firstActual.classList.remove('v19-group-start');
      if(r.noCurrentSelection){
        for(const index of [5,6,7]){tr.cells[index].textContent=index===7?'本版未覆盖':'—';tr.cells[index].removeAttribute('style');}
        tr.dataset.noCurrentSelection='true';
      }
      if(!yieldAligned()){const y=tr.querySelector('[data-summary-column="history-yield"]');if(y){y.textContent='—';y.title=yieldMismatch;}}
    }
    const note=document.createElement('div');note.className='tiny2 v19-selection-note';
    note.textContent='波动率 =（本版投资 − 上版投资）÷ 上版投资；'+(versions.length?'来源版本 '+versions.join(' / ')+'，按当前 Initiative 集合比较，上版包含本版已移除经销商的原投入。':'尚无来源版本的可见提交。')+' Phasing = 实际 Delivery Vol 合计 ÷ 合同量合计。'+(yieldAligned()?'':yieldMismatch);
    table.closest('.tablewrap').after(note);
    return t.innerHTML.replaceAll('该 SD 经销商总数','当前名单内该 SD 经销商数').replaceAll('全部 =','名单 =');
  };
  function clarifyScope(root) {
    if(!root)return;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
    const replacements=[['全量经销商为分母','当前业务范围勾选名单的并集为分母'],['经销商明细表为全量经销商','经销商明细表为当前业务范围勾选名单的并集'],['组合看板明细以全量经销商为范围','组合看板明细以当前业务范围勾选名单的并集为范围']];
    while((node=walker.nextNode())){if(node.parentElement?.closest('script,style'))continue;let text=node.nodeValue;for(const [before,after]of replacements)text=text.replaceAll(before,after);if(text!==node.nodeValue)node.nodeValue=text;}
  }
  const beforeRender=render;render=function(...args){const result=beforeRender(...args);clarifyScope(document.getElementById('main'));return result;};
  const beforeModal=modal;modal=function(...args){const result=beforeModal(...args);clarifyScope(document.getElementById('layer'));return result;};
  render();
})();

</script>

<script>
/* V19 workspace review: shared tab presentation, fixed historical comparison and Owner-only support details. */
(() => {
  const hasNumber = value => value !== null && value !== undefined && value !== '' && Number.isFinite(Number(value));
  const number = value => hasNumber(value) ? Number(value) : null;
  const fraction = (numerator, denominator) => hasNumber(numerator) && Number(denominator) > 0 ? Number(numerator) / Number(denominator) : null;
  const percent = value => value === null || value === undefined ? '—' : fmt(value * 100, 1) + '%';
  const multiple = value => v20Yield(value);
  const years = () => window.V19HistoryMetadata?.years?.() || { dataYear: 2026, annualYear: 2025, baselineYear: 2024, annualPeriod: '2025', ytdPeriod: '2026YTD', baselinePeriod: '2024', yoyLabel: 'YoY 2025 vs 2024' };
  function read(dealer, period) {
    if (window.V19HistoryMetadata?.read) return window.V19HistoryMetadata.read(dealer, period) || {};
    return dealer.history?.[period] || {};
  }
  function metrics(dealer, period) {
    if (window.V19HistoryMetadata?.metrics) return window.V19HistoryMetadata.metrics(dealer, period) || {};
    const data = read(dealer, period);
    return { ...data, phasing: fraction(data.vol, data.contract), yield: fraction(data.c3, data.investment) };
  }
  function growth(dealer, metric) {
    if (window.V19HistoryMetadata?.yoy) return window.V19HistoryMetadata.yoy(dealer, metric)?.value ?? null;
    const before = dealer[metric === 'vol' ? 'v24' : 'c24'];
    const after = read(dealer, '2025')[metric];
    return hasNumber(after) && Number(before) > 0 ? (Number(after) - Number(before)) / Number(before) : null;
  }
  function growthCell(value) {
    return value === null ? '<span class="yoy none">无基期</span>' : `<span class="yoy ${value > 0 ? 'up' : value < 0 ? 'down' : 'flat'}">${value > 0 ? '+' : ''}${fmt(value * 100, 1)}%</span>`;
  }
  function metricCells(dealer, period, marker) {
    const data = read(dealer, period), ratios = metrics(dealer, period);
    return `<td class="num v19-compare-start" data-history-period="${esc(period)}" data-history-metric="vol">${hasNumber(data.vol) ? fmt(data.vol) : '—'}</td><td class="num" data-history-period="${esc(period)}" data-history-metric="c3">${hasNumber(data.c3) ? kd(data.c3) : '—'}</td><td class="num" data-history-period="${esc(period)}" data-history-metric="phasing">${percent(number(ratios.phasing))}</td><td class="num" data-history-period="${esc(period)}" data-history-metric="yield"${ratios.yield == null ? ' title="缺少可比较的实际产出或历史投资覆盖，暂不计算 Yield"' : ''}>${multiple(number(ratios.yield))}</td>`;
  }

  // Shared component: all rows come from the current Owner's assigned initiatives and working drafts.
  function ownSupportRows(dealerId, excludeId = st.id) {
    if (st.role !== 'owner') return [];
    return own().filter(config => config.owner === st.owner && config.id !== excludeId).map(config => {
      const plan = draft(st.version, config.id), amount = Number(plan.amounts?.[dealerId]) || 0;
      return { id: config.id, name: config.name, type: config.type, owner: config.owner, amount, note: plan.notes?.[dealerId] || '', selected: (plan.selected || []).includes(dealerId) };
    }).filter(row => row.amount > 0).sort((a, b) => b.amount - a.amount || a.id.localeCompare(b.id));
  }
  function supportSummary(dealerId, excludeId = st.id) {
    const rows = ownSupportRows(dealerId, excludeId), total = sum(rows.map(row => row.amount));
    return rows.length ? `<button type="button" class="small quiet link v19-other-summary" data-v19-other-details="${esc(dealerId)}" data-v19-exclude="${esc(excludeId)}" aria-label="查看本人其他 ${rows.length} 个 Initiative 的投入明细"><b>${rows.length} 项 · ${wan(total)} 万</b><span>查看明细 →</span></button>` : '<span class="muted">—</span>';
  }
  function supportDetail(dealerId, excludeId = st.id) {
    const dealer = SEED.dealers.find(item => item.id === dealerId), rows = ownSupportRows(dealerId, excludeId), total = sum(rows.map(row => row.amount));
    const current = cat().find(config => config.id === excludeId && config.owner === st.owner), context = [st.user, st.version, excludeId, dealerId, 'own-support'].join(':');
    return `<section class="v19-other-component" data-v19-other-detail="${esc(dealerId)}" data-local-frame="${esc(context)}"><div class="v19-other-context"><span>${esc(st.version)} · ${esc(st.owner)}的工作草稿</span><span>${esc(dealer?.id || dealerId)} · ${esc(dealer?.sd || '')} / ${esc(dealer?.rsm || '')}</span></div><div class="v19-other-overview"><div><span>本人其他 Initiative</span><strong>${rows.length} 项</strong></div><div><span>合计投入（人民币元）</span><strong>${fmt(total)}</strong></div><p>仅列本人负责且向这家经销商投入的项目${current ? '，不含“' + esc(current.name) + '”' : ''}。占比按本表合计计算。</p></div><div class="tablewrap"><table class="v19-other-table"><thead><tr><th>Initiative</th><th>资源大类</th><th class="num">金额（元）</th><th class="num">占本人其他投入</th><th>调整说明</th></tr></thead><tbody>${rows.map(row => `<tr data-other-project="${esc(row.id)}"><td><button type="button" class="small quiet link" data-v19-other-project="${esc(row.id)}">${esc(row.name)}</button><div class="tiny">${esc(row.id)}</div></td><td><span class="pill gray">${esc(row.type)}</span></td><td class="num"><b>${fmt(row.amount)}</b></td><td class="num">${percent(fraction(row.amount, total))}</td><td class="v19-other-note">${esc(row.note || '—')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">本人其他 Initiative 暂无对这家经销商的投入。</td></tr>'}<tr class="totalrow"><td>合计</td><td>${rows.length} 项</td><td class="num">${fmt(total)}</td><td class="num">${total > 0 ? '100.0%' : '—'}</td><td></td></tr></tbody></table></div></section>`;
  }
  function openSupport(dealerId, excludeId = st.id) {
    if (st.role !== 'owner') return;
    const dealer = SEED.dealers.find(item => item.id === dealerId); if (!dealer) return;
    modal('本人其他 Initiative · ' + dealer.name, supportDetail(dealerId, excludeId), undefined, true);
    const dialog = document.querySelector('#layer [role=dialog]');
    dialog?.querySelectorAll('.local-history,.v19-history-controls').forEach(control => control.remove());
  }
  window.V19OtherInitiatives = { rows: ownSupportRows, summary: supportSummary, detail: supportDetail, open: openSupport };

  const priorScope = scopeStep;
  scopeStep = function(config, plan) {
    const template = document.createElement('template'); template.innerHTML = priorScope(config, plan);
    // This selection window deliberately shows both Actual periods side by side, independently of local analysis controls.

    table.tBodies[0].innerHTML = filtered().map(dealer => `<tr data-scope-dealer="${esc(dealer.id)}"><td><input type="checkbox" data-select="${esc(dealer.id)}" ${selected.has(dealer.id) ? 'checked' : ''} aria-label="选择${esc(dealer.name)}"></td><td><button class="quiet small link" data-dealer="${esc(dealer.id)}">${esc(dealer.name)}</button><div class="tiny">${esc(dealer.id)}</div></td><td>${esc(dealer.sd)} / ${esc(dealer.rsm)}</td><td><span class="pill ${dealer.status === 'active' ? 'green' : 'gray'}">${esc(dealer.status)}</span></td>${periods.map((period, index) => metricCells(dealer, period, index)).join('')}<td class="num v19-compare-start" data-history-yoy="vol">${growthCell(growth(dealer, 'vol'))}</td><td class="num" data-history-yoy="c3">${growthCell(growth(dealer, 'c3'))}</td>${periods.map((period, index) => { const investment = number(read(dealer, period).investment); return `<td class="num ${index ? '' : 'v19-compare-start'}" data-history-investment="${esc(period)}">${investment === null ? '—' : kd(investment)}</td><td class="num" data-history-share="${esc(period)}" title="${selected.has(dealer.id) ? '分母为本项目已勾选名单的历史投资总额' : '未勾选，尚未纳入当前名单'}">${selected.has(dealer.id) ? percent(fraction(investment, totals[index])) : '—'}</td>`; }).join('')}<td>${supportSummary(dealer.id, config.id)}</td></tr>`).join('') || '<tr><td colspan="19" class="empty">暂无匹配经销商</td></tr>';
    const wrapper = table.closest('.tablewrap');

    const cover = template.content.querySelector('.covergrid');
    if (cover) cover.innerHTML = [...new Set(SEED.dealers.map(dealer => dealer.sd))].sort().map(sd => { const all = SEED.dealers.filter(dealer => dealer.sd === sd), picked = selectedRows.filter(dealer => dealer.sd === sd); return `<div class="statmini v19-scope-coverage"><b>${esc(sd)}</b><p>已选 ${picked.length} / ${all.length} 家</p>${periods.map((period, index) => `<div class="tiny">${index ? esc(ytdLabel) : meta.annualYear} · Vol 覆盖 ${percent(fraction(sum(picked.map(dealer => Number(read(dealer, period).vol) || 0)), sum(all.map(dealer => Number(read(dealer, period).vol) || 0))))} · C3 覆盖 ${percent(fraction(sum(picked.map(dealer => Number(read(dealer, period).c3) || 0)), sum(all.map(dealer => Number(read(dealer, period).c3) || 0))))}</div>`).join('')}</div>`; }).join('');
    return template.innerHTML;
  };

  function decorateWorkspace() {
    if (st.role !== 'owner' || st.view !== 'work') return;
    const bar = document.querySelector('#main .steps,#main .v19-workspace-tabs');
    if (bar) {
      bar.classList.remove('steps'); bar.classList.add('portfolio-tabbar', 'v19-workspace-tabs');
      bar.setAttribute('role', 'tablist'); bar.setAttribute('aria-label', '拆分工作台');
      bar.querySelectorAll('[data-step]').forEach(button => {
        const step = Number(button.dataset.step), active = step === st.step;
        button.querySelector('.stepnum')?.remove(); button.classList.remove('active');
        button.id = 'workspace-tab-' + step; button.dataset.v19WorkspaceStep = String(step);
        button.setAttribute('role', 'tab'); button.setAttribute('aria-controls', 'stepbody');

      });
      const panel = document.getElementById('stepbody');
      if (panel) { panel.setAttribute('role', 'tabpanel'); panel.setAttribute('aria-labelledby', 'workspace-tab-' + st.step); panel.tabIndex = 0; }
    }
    if (st.step === 2) document.querySelectorAll('#stepbody .local-history,#stepbody .v19-history-controls').forEach(control => control.remove());
  }
  const priorRender = render;
  render = function(...args) { const result = priorRender(...args); decorateWorkspace(); return result; };
  const priorRefresh = refreshTable;
  refreshTable = function(...args) { const result = priorRefresh(...args); decorateWorkspace(); return result; };
  function activateStep(step, focus = true) {
    if (st.role !== 'owner' || st.view !== 'work' || ![1, 2, 3].includes(step)) return;
    st.step = step; render();
    if (focus) document.getElementById('workspace-tab-' + step)?.focus({ preventScroll: true });
  }
  window.addEventListener('click', event => {
    const tab = event.target.closest?.('[data-v19-workspace-step]');
    if (tab) { event.preventDefault(); event.stopImmediatePropagation(); activateStep(Number(tab.dataset.v19WorkspaceStep)); return; }
    const detail = event.target.closest?.('[data-v19-other-details]');
    if (detail) { event.preventDefault(); event.stopImmediatePropagation(); openSupport(detail.dataset.v19OtherDetails, detail.dataset.v19Exclude || st.id); return; }
    const project = event.target.closest?.('[data-v19-other-project]');
    if (project) { event.preventDefault(); event.stopImmediatePropagation(); const config = own().find(item => item.id === project.dataset.v19OtherProject && item.owner === st.owner); if (config && st.role === 'owner') projectDetail(config.id); }
  }, true);
  window.addEventListener('keydown', event => {
    const tab = event.target.closest?.('[data-v19-workspace-step]'); if (!tab) return;
    const currentStep = Number(tab.dataset.v19WorkspaceStep); let next;
    if (event.key === 'ArrowRight') next = currentStep % 3 + 1;
    else if (event.key === 'ArrowLeft') next = (currentStep + 1) % 3 + 1;
    else if (event.key === 'Home') next = 1;
    else if (event.key === 'End') next = 3;
    if (next) { event.preventDefault(); event.stopImmediatePropagation(); activateStep(next); }
  }, true);
  window.V19WorkspaceReview = { years, read, metrics, growth, decorate: decorateWorkspace };
  render();
})();

<script>
/* Concrete SD findings and in-place navigation; uses the surrounding window's history context. */
(() => {
  const percentage=n=>fmt(n,1)+'%';
  function finding(sd,investment,output,diff){
    return `${esc(sd)}：投资占比 ${percentage(investment)}，${esc(ML())} 占比 ${percentage(output)}，<strong>${diff>0?'偏多':'偏少'} ${fmt(Math.abs(diff),1)} pp</strong>`;
  }
  function callout(rows,inis,threshold){
    const aggregate=rows.filter(r=>Math.abs(r.g)>threshold[0]).sort((a,b)=>Math.abs(b.g)-Math.abs(a.g));
    const facts=inis.flatMap(({i,x})=>x.cells.filter(c=>c.cov&&Math.abs(c.d)>threshold[0]).map(c=>({i,c}))).sort((a,b)=>Math.abs(b.c.d)-Math.abs(a.c.d));
    const high=[...aggregate.map(r=>r.g),...facts.map(f=>f.c.d)].some(d=>Math.abs(d)>threshold[1]);
    return `<div class="callout v19-sd-facts ${high?'bad':aggregate.length||facts.length?'mid':'good'}"><div class="v19-sd-facts-block"><b>① 叠加后 SD 分配</b>${aggregate.length?aggregate.map(r=>`<button type="button" class="v19-sd-fact" data-sd-fact-jump="aggregate" data-fact-sd="${esc(r.sd)}">${finding(r.sd,r.sa,st.hBasis==='vol'?r.sv:r.sc,r.g)}<span class="v19-fact-location">定位到① →</span></button>`).join(''):`<p>各 SD 投资占比与 ${esc(ML())} 占比的差值均在 ±${threshold[0]} pp 内。</p>`}</div><div class="v19-sd-facts-block"><b>② Initiative 分配明细</b>${facts.length?facts.map(({i,c})=>`<button type="button" class="v19-sd-fact" data-sd-fact-jump="initiative" data-fact-initiative="${esc(i.id)}" data-fact-sd="${esc(c.sd)}"><span><strong>${esc(i.name)}</strong>${st.role==='dept'?` <span class="v19-fact-owner">· Owner：${esc(i.owner)}</span>`:''}</span><span>${finding(c.sd,c.s,c.m,c.d)}</span><span class="v19-fact-location">定位到②对应位置 →</span></button>`).join(''):`<p>各 Initiative 在已覆盖 SD 内的偏离均在 ±${threshold[0]} pp 内。</p>`}</div><p class="v19-fact-rule">${esc(PL(st.period))} · ${esc(ML())}；差值 = 投资占比 − 产出占比。按已勾选名单计算，逐项列出超过 ±${threshold[0]} pp 的偏离；超过 ±${threshold[1]} pp 优先关注。</p></div>`;
  }
  function owners(root){
    if(st.role!=='dept'||!root)return;
    const configs=cat(),groups=groupsOf(boardItems());
    root.querySelectorAll('[data-project],[data-hgroup],#deptIni option').forEach(el=>{
      if(el.closest('table'))return;
      if(el.querySelector('.v19-inline-owner')||el.dataset.v19OwnerAdded)return;
      const config=el.dataset.project?configs.find(i=>i.id===el.dataset.project):el.dataset.hgroup?groups.find(g=>g.key===el.dataset.hgroup)?.init:configs.find(i=>i.id===el.value);
      if(!config?.owner)return;
      if(el.tagName==='OPTION'){el.textContent+=' · '+config.owner;el.dataset.v19OwnerAdded='true';}
      else{const label=document.createElement('span');label.className='v19-inline-owner';label.textContent=' · Owner：'+config.owner;el.append(label);}
    });
  }
  function ownerColumns(html){
    if(st.role!=='dept'||typeof html!=='string')return html;
    const t=document.createElement('template');t.innerHTML=html;const configs=cat(),groups=groupsOf(boardItems());
    for(const table of t.content.querySelectorAll('table')){
      if(!table.querySelector('tbody [data-project],tbody [data-hgroup]')||!table.tHead||table.tHead.rows.length!==1)continue;
      const header=table.tHead.rows[0],heads=[...header.cells],index=heads.findIndex(h=>/Initiative/.test(h.textContent));
      if(index<0||heads.some(h=>h.textContent.trim()==='Owner'))continue;
      const th=document.createElement('th');th.textContent='Owner';header.insertBefore(th,header.cells[index+1]||null);
      const combined=heads.findIndex(h=>/资源大类\s*[·/]\s*Owner/.test(h.textContent));
      if(combined>=0)heads[combined].textContent='资源大类';
      for(const row of table.querySelectorAll('tbody tr,tfoot tr')){
        if(row.cells.length===1&&row.cells[0].colSpan>1){row.cells[0].colSpan++;continue;}
        const button=row.querySelector('[data-project],[data-hgroup]');
        const cfg=button?.dataset.project?configs.find(x=>x.id===button.dataset.project):button?.dataset.hgroup?groups.find(g=>g.key===button.dataset.hgroup)?.init:null;
        if(combined>=0&&cfg?.owner&&row.cells[combined])row.cells[combined].textContent=row.cells[combined].textContent.replace(new RegExp('\\s*[·/]\\s*'+cfg.owner+'\\s*$'),'');
        const td=document.createElement('td');td.textContent=cfg?.owner||'—';row.insertBefore(td,row.cells[index+1]||null);
      }
    }
    return t.innerHTML;
  }
  const beforeBoard=board;board=function(...args){return ownerColumns(beforeBoard(...args))};
  const beforeRender=render;render=function(...args){const result=beforeRender(...args);owners(document.getElementById('main'));return result};
  const beforeModal=modal;modal=function(...args){if(st.role==='dept'&&typeof args[1]==='string')args[1]=ownerColumns(args[1]);const result=beforeModal(...args);owners(document.getElementById('layer'));return result};
  const observer=new MutationObserver(()=>{owners(document.getElementById('main'));owners(document.getElementById('layer'))});
  for(const root of [document.getElementById('main'),document.getElementById('layer')])if(root)observer.observe(root,{childList:true,subtree:true});
  window.addEventListener('click',event=>{
    const link=event.target.closest?.('[data-sd-fact-jump]');if(!link)return;
    event.preventDefault();event.stopImmediatePropagation();
    const section=link.closest('#sec4'),sd=link.dataset.factSd;
    let row,cell;
    if(link.dataset.sdFactJump==='initiative'){
      row=[...section.querySelectorAll('[data-sd-initiative]')].find(r=>r.dataset.sdInitiative===link.dataset.factInitiative);
      cell=[...row?.querySelectorAll('[data-sd-fact]')||[]].find(c=>c.dataset.sdFact===sd);
    }else{row=[...section.querySelectorAll('[data-balrow]')].find(r=>r.dataset.balrow===sd);cell=row;}
    if(!row||!cell)return;
    section.querySelectorAll('.v19-fact-target').forEach(e=>e.classList.remove('v19-fact-target'));
    cell.classList.add('v19-fact-target');cell.tabIndex=-1;
    const wrap=row.closest('.tablewrap');
    wrap?.scrollIntoView({block:'center',behavior:'instant'});
    if(wrap){const r=row.getBoundingClientRect(),w=wrap.getBoundingClientRect(),head=wrap.querySelector('thead')?.getBoundingClientRect().height||0;wrap.scrollTop+=r.top-w.top-head-12;const c=cell.getBoundingClientRect();if(c.left<w.left||c.right>w.right)wrap.scrollLeft+=c.left-w.left-24;}
    cell.focus({preventScroll:true});
  },true);
  window.V19SDFacts={callout,owners};render();
})();

<script>

(() => {
 const items=()=>cat().filter(c=>c.enabled&&c.sector===st.sector&&c.dept===st.dept);
 const authorized=()=>st.role==='dept'&&(curUser().scopes||[]).some(s=>s.sector===st.sector&&s.dept===st.dept);
 const ready=c=>{const s=v19RawSubmitted(st.version,c.id);return !!s&&!s.requiresResubmission};

开放修改</h2><div class="dept-owner-grid">${owners.map(owner=>{const list=all.filter(c=>c.owner===owner),submitted=list.filter(ready).length;return `<div class="card"><b>${esc(owner)}</b><p>已提交 ${submitted} / ${list.length} 个 Initiative</p><button data-dept-return="owner" data-return-owner="${esc(owner)}" ${!confirmed.length&&submitted?'':'disabled'}>退回该 Owner，开放修改</button></div>`}).join('')}</div><p class="tiny">已确认时请先撤回部门确认。退回按当前部门、当前版本进行，不影响该 Owner 在其他部门或版本的项目。</p></section>`;

 }
 function returnPlans(){

  const previousTable = unifiedTable;
  unifiedTable = function(rows, amounts, edit, items, ...args) {
    if ((edit&&st.tableSort==='support')||(fees.includes(st.tableSort)&&!allowed(st.tableSort))) {st.tableSort='amount';st.tableDir=-1;}
    const sort = st.tableSort, direction = st.tableDir;
    const template = document.createElement('template');
    template.innerHTML = previousTable(rows, amounts, edit, items, ...args);
    // V19 intentionally removed the inactive metric; V17 displays both and both remain sortable.
    st.tableSort = sort;st.tableDir = direction;
    const selectedItems = Array.isArray(items) ? items : V19SelectionScope.currentItems();
    const selected = V19SelectionScope.rows(selectedItems);
    const frame = template.content.querySelector('[data-local-frame]')?.dataset.localFrame || V19LocalHistory.key('dealer-table');
    V19LocalHistory.within(frame, () => {
      const baseline = document.createElement('template');
      // This is the V17 table renderer captured before V18/V19 layout overrides. Its data accessors
      // remain dynamic, so current selection, coverage, null handling and totals still come from V19.
      baseline.innerHTML = _utV16(selected, amounts, edit, selectedItems);
      const table = baseline.content.querySelector('.unified'), target = template.content.querySelector('.unified');
      if (!table || !target) return;
      const keep = order.filter(field => !fees.includes(field) || allowed(field));
      const indices = keep.map(field => order.indexOf(field));
      const originalCols = [...table.querySelector('colgroup').children];
      for (const row of table.querySelectorAll('tr:not(.grouphead)')) {
        const cells = [...row.cells];
        if (cells.length === 1 && cells[0].colSpan > 1) {cells[0].colSpan=keep.length;continue;}
        row.replaceChildren(...indices.map(index => cells[index]));
        [...row.cells].forEach((cell,index) => {cell.dataset.column=keep[index];});
      }
      table.querySelector('colgroup').replaceChildren(...indices.map(index=>originalCols[index]));
      table.querySelector('.grouphead').innerHTML = groups.map(([label,fields,cls]) => {
        const count = fields.filter(field=>keep.includes(field)).length;
        return count ? `<th colspan="${count}" class="${cls}">${esc(label)}</th>` : '';
      }).join('');
      table.dataset.v19Columns=keep.join(',');table.dataset.v20Columns=keep.join(',');
      table.dataset.selectionCount=String(selected.length);table.dataset.selectionIds=selected.map(d=>d.id).join(',');
      table.classList.add('v20-dealer-details');
      const data=tableData(selected,amounts,selectedItems),records=new Map(data.records.map(record=>[record.d.id,record]));
      const formatYield=(cell,value)=>{
        if(!cell)return;
        if(value==null||!Number.isFinite(Number(value))||Number(value)<0){cell.textContent='—';cell.title='缺少有效同期间数据或 Yield 为负，不显示数值';return;}
        const walker=document.createTreeWalker(cell,NodeFilter.SHOW_TEXT);let text;
        while((text=walker.nextNode()))text.textContent=text.textContent.replace(/(\d(?:[\d,.]*))\s*[x×]/g,'$1');
        for(const node of [cell,...cell.querySelectorAll('[title]')])if(node.hasAttribute('title'))node.title=node.title.replace(/(\d(?:[\d,.]*))\s*[x×]/g,'$1');
      };
      for(const row of table.querySelectorAll('[data-tablerow]'))formatYield(row.querySelector('[data-column="yield"]'),records.get(row.dataset.tablerow)?.yield);
      if(edit){
        table.classList.add('v20-allocation-detail');
        const supportHeader=table.querySelector('[data-tsort="support"]');
        if(supportHeader)supportHeader.parentElement.textContent='获配项目';
        for(const row of table.querySelectorAll('[data-tablerow]')){
          const cell=row.querySelector('[data-column="support"]');
          const id=row.dataset.tablerow;
          const awarded=awardedProjects(id,selectedItems);
          cell.innerHTML=awarded.length?`<div class="v20-awarded-projects" aria-label="获配项目">${awarded.map(item=>`<button type="button" class="small quiet link v20-awarded-project" data-v20-awarded-project="${esc(item.id)}" data-v20-awarded-dealer="${esc(id)}">${esc(item.name||item.id)}</button>`).join('')}</div>`:'—';
        }
      }
      formatYield(table.tFoot?.querySelector('[data-column="yield"]'),data.totals.yield);
      for(const field of ['contract','vol','c3','investment',...fees])if(!data.records.some(record=>record.h[field]!=null)){
        const cell=table.tFoot?.querySelector(`[data-column="${field}"]`);if(cell)cell.textContent='—';
      }
      const amountHeader=table.querySelector('[data-tsort="amount"]');
      if (!edit && amountHeader) amountHeader.childNodes[0].textContent='累计投资金额（万元） ';
      target.replaceWith(table);
      if(edit)table.closest('.unifiedwrap')?.classList.add('v20-allocation-scroll');
      // The inherited renderer's search/pagination/benchmarks must describe the exact same sorted table.
      for (const selector of ['.pagination','.benchstrip']) {
        const source=baseline.content.querySelector(selector),dest=template.content.querySelector(selector);
        if(source&&dest)dest.replaceWith(source);
      }
      const bench=template.content.querySelector('.benchstrip');
      if(bench){for(const span of bench.children){if(span.textContent.includes('加权平均 Yield'))formatYield(span.querySelector('b'),data.totals.yield);if(span.textContent.includes('全量经销商'))span.innerHTML=span.innerHTML.replaceAll('全量经销商','当前勾选名单');}}
      const jumps=template.content.querySelector('.tablejumps');
      if(jumps)jumps.innerHTML='<span class="tiny">快速定位列组</span><button type="button" data-jump="share">占比与差值</button><button type="button" data-jump="contract">① 合同</button><button type="button" data-jump="vol">② Actual / Phasing</button><button type="button" data-jump="investment">③ 历史投资 / Yield</button>';
      const foot=template.content.querySelector('.tablefoot');
      if(foot)foot.innerHTML=`<b>Phasing = Delivery Vol ÷ 合同量；Yield = C3 ÷ 同期间历史投资总额。</b><br>历史参考：${esc(PL(st.period))}。Vol、C3 及两项占比和差值同时展示；搜索、排序、分页不改变当前勾选名单（${selected.length} 家）的分母。历史投资总额、Yield、历史投资占比公开；费用明细仅显示本人所属部门对应且已授权的大类。当前规划编辑单位人民币元、汇总展示万元；历史 C3 与费用单位 K$。`;
    });
    return template.innerHTML;
  };

  // Historical detail tables already delegate to V19DataViews.allowed. The resource-mix drawer
  // also contains a historical breakdown; remove denied values before inserting its HTML.
  function sanitize(root) {
    for(const box of root.querySelectorAll('.cmpdonut')) {
      const halves=[...box.children].filter(node=>node.tagName==='DIV');
      if(halves[1]&&!fees.every(allowed)) halves[1].innerHTML='<div class="emptyinline">历史费用构成仅显示本人所属部门可见明细</div>';
      for(const row of box.querySelectorAll('tbody tr')) {
        const field=fees.find(f=>row.cells[0]?.textContent.trim()===names[f]);
        if(field&&!allowed(field)) for(const index of [3,4]) if(row.cells[index]) {
          row.cells[index].replaceChildren(document.createTextNode('—'));
          for(const attribute of [...row.cells[index].attributes])row.cells[index].removeAttribute(attribute.name);
          row.cells[index].className='num';
        }
      }
    }
  }
  const priorModal=modal;
  modal=function(title,body,...args) {
    if(typeof body==='string') {const template=document.createElement('template');template.innerHTML=body;sanitize(template.content);body=template.innerHTML;}
    const result=priorModal(title,body,...args);sanitize(document.querySelector('#layer'));return result;
  };

  // Existing money/roster exports contain no history. Guard the shared spreadsheet writer so a
  // historical expense column (including Opex Yield, which reveals excluded Capex) cannot leak.
  function exportRows(rows) {
    if(!Array.isArray(rows)||!Array.isArray(rows[0]))return rows;
    const denied=rows[0].map((header,index)=>{
      const label=String(header).replace(/\s/g,'').toLowerCase();
      const field=fees.find(f=>label===f||label.startsWith(names[f].replace(/\s/g,'').toLowerCase()));
      return field&&!allowed(field)||label.includes('opexyield')&&!fees.every(allowed)?index:-1;
    }).filter(index=>index>=0);
    return denied.length?rows.map(row=>row.filter((_,index)=>!denied.includes(index))):rows;
  }
  const priorXlsx=xlsx;
  xlsx=function(rows,...args){return priorXlsx(exportRows(rows),...args);};

  const priorAdminUsers=adminUsers;
  adminUsers=function(...args){
    const template=document.createElement('template');template.innerHTML=priorAdminUsers(...args);
    const roleTable=template.content.querySelector('[data-v19-access-role]')?.closest('.tablewrap');roleTable?.remove();
    const intro=template.content.querySelector('.v19-history-permissions .sub');
    if(intro)intro.textContent='历史投资总额、Yield、历史投资占比公开。明细上限：MKT 看 MRD / SP&A；ICE 看 ICE Rebate / SP&A；Capex 看 Capex。部门及用户配置只能收窄，不能跨部门扩权。';
    for(const option of template.content.querySelectorAll('[data-v19-access-user-mode] option[value="inherit"]'))option.textContent='沿用所属部门';
    for(const input of template.content.querySelectorAll('[data-v19-access-user]')){
      const user=db.users.find(u=>u.id===input.dataset.v19AccessUser),ceiling=departmentFields[String(user?.homeScope?.dept).toUpperCase()]||[];
      if(!ceiling.includes(input.dataset.v19AccessField)){input.checked=false;input.disabled=true;input.title='不属于该用户所属部门';}
    }
    const department=template.content.querySelector('#v19-access-department')?.value?.split('|')[1];
    const ceiling=departmentFields[String(department).toUpperCase()]||[];
    for(const input of template.content.querySelectorAll('[data-v19-department-field]'))if(!ceiling.includes(input.dataset.v19DepartmentField)){input.checked=false;input.disabled=true;input.title='不属于该部门对应大类';}
    const sub=template.content.querySelector('.v19-department-defaults .sub');
    if(sub)sub.textContent='默认显示所属部门对应大类；可进一步收窄，不能授权其他部门大类。缺少所属部门时不显示任何费用明细。';
    const inherit=template.content.querySelector('#v19-access-department-mode option[value="inherit"]');if(inherit)inherit.textContent='沿用所属部门对应大类';
    return template.innerHTML;
  };
  const priorHelp=help;
  help=function(...args){const result=priorHelp(...args);const note=document.querySelector('.v19-history-source-note');if(note)note.lastElementChild.textContent='当前为原型快照，未查询真实数据库。历史费用只看本人所属部门对应大类，用户权限只能进一步收窄；总额、Yield、历史投资占比保持公开。';return result;};
  window.V20DealerDetails={order,groups,departmentFields,accessSource,allowed,sanitize,exportRows};
  function decorateAccessControls(){
    for(const option of document.querySelectorAll('[data-v19-access-user-mode] option[value="inherit"]'))option.textContent='沿用所属部门';
    for(const input of document.querySelectorAll('[data-v19-access-user]')){
      const user=db.users.find(u=>u.id===input.dataset.v19AccessUser),ceiling=departmentFields[String(user?.homeScope?.dept).toUpperCase()]||[];
      if(!ceiling.includes(input.dataset.v19AccessField)){input.checked=false;input.disabled=true;}
    }
    const department=document.querySelector('#v19-access-department')?.value?.split('|')[1],ceiling=departmentFields[String(department).toUpperCase()]||[];
    for(const input of document.querySelectorAll('[data-v19-department-field]'))if(!ceiling.includes(input.dataset.v19DepartmentField)){input.checked=false;input.disabled=true;}
  }
  const priorRender=render;
  render=function(...args){const result=priorRender(...args);decorateAccessControls();positionAllocationHeader();return result;};
  const priorRefresh=refreshTable;
  refreshTable=function(...args){const result=priorRefresh(...args);positionAllocationHeader();return result;};
  window.addEventListener('change',event=>{if(event.target.matches?.('[data-v19-access-user-mode],#v19-access-department-mode'))decorateAccessControls();},true);
  render();
})();

/* User-confirmed V17 step-one review restored in V20. Session-only workflow gate. */
(() => {
  const storageKey='ResourceStudioV20ReserveReview';
  let reviews={};try{reviews=JSON.parse(sessionStorage.getItem(storageKey)||'{}')}catch{}
  const identity=(config)=>[curUser()?.id,st.version,config?.id||st.id].join('|');
  const fingerprint=(config,plan)=>JSON.stringify({budget:config.budget,reserves:plan.reserves||[]});
  const reviewed=(config,plan)=>reviews[identity(config)]===fingerprint(config,plan);
  function state(){
    if(st.role!=='owner'||st.view!=='work')return null;
    const config=currentConfig();if(!config)return null;
    const plan=current();return {config,plan,readOnly:!editable()};
  }
  function decorate(){
    const currentState=state();if(!currentState)return;
    const {config,plan,readOnly}=currentState,confirmed=readOnly||reviewed(config,plan);
    const checkbox=document.getElementById('v20-reserve-review');
    if(checkbox){checkbox.checked=confirmed;checkbox.disabled=readOnly;}
    document.querySelectorAll('#main [data-v19-workspace-step],#main [data-step]').forEach(button=>{
      const step=Number(button.dataset.v19WorkspaceStep||button.dataset.step);
      button.disabled=!confirmed&&step>1;
      if(!confirmed&&step>1)button.title='请先勾选“已核对本版预留”';else button.removeAttribute('title');
    });
    const next=document.querySelector('#main [data-action="next"]');
    if(next)next.disabled=st.step===1&&!confirmed;
  }
  const priorBudget=budgetStep;
  budgetStep=function(config,plan){return priorBudget(config,plan)+`<div class="callout v20-reserve-review"><label class="checkline"><input type="checkbox" id="v20-reserve-review" ${reviewed(config,plan)?'checked':''}>已核对本版预留</label><p>请核对本版预算及各笔预留的金额、原因后再继续。预算或预留内容变动后，需要重新勾选。</p></div>`;};
  const pendingReview=ids=>ids.map(id=>cat().find(config=>config.id===id&&config.enabled&&config.owner===st.owner)).filter(Boolean).filter(config=>{
    const plan=draft(st.version,config.id),snapshot=submitted(st.version,config.id);
    return !(snapshot&&businessSnapshot(snapshot)===businessSnapshot(plan))&&!reviewed(config,plan);
  });
  const blockSubmission=ids=>{
    const missing=pendingReview(ids);
    if(!missing.length)return false;
    st.submitIds=[];
    modal('请先核对本版预留','<div class="notice yellow">以下项目尚未完成第一步核对，请进入拆分工作台勾选“已核对本版预留”后再提交。</div><ul>'+missing.map(config=>'<li>'+esc(config.name)+'</li>').join('')+'</ul>');
    return true;
  };
  const priorSubmitDialog=submitDialog;
  submitDialog=function(ids){if(!blockSubmission(ids))return priorSubmitDialog(ids);};
  window.addEventListener('click',event=>{
    if(event.target.closest?.('[data-action="confirmsubmit"]')&&blockSubmission(st.submitIds||[])){
      event.preventDefault();event.stopImmediatePropagation();
    }
  },true);
  const priorRender=render;
  render=function(...args){
    const currentState=state();
    if(currentState&&!currentState.readOnly&&!reviewed(currentState.config,currentState.plan)){
      st.step=1;delete reviews[identity()];sessionStorage.setItem(storageKey,JSON.stringify(reviews));
    }
    const result=priorRender(...args);decorate();return result;
  };
  window.addEventListener('change',event=>{
    if(event.target.id!=='v20-reserve-review')return;
    const currentState=state();if(!currentState||currentState.readOnly)return;
    if(event.target.checked)reviews[identity()]=fingerprint(currentState.config,currentState.plan);else delete reviews[identity()];
    sessionStorage.setItem(storageKey,JSON.stringify(reviews));decorate();
  },true);
  for(const type of ['input','change','click'])document.addEventListener(type,event=>{
    if(event.target.closest?.('[data-reserve],[data-reason],[data-delreserve],[data-action="addreserve"]'))queueMicrotask(()=>{
      const currentState=state();if(!currentState||currentState.readOnly)return;
      if(!reviewed(currentState.config,currentState.plan)){delete reviews[identity()];sessionStorage.setItem(storageKey,JSON.stringify(reviews));}
      decorate();
    });
  });
  window.V20ReserveReview={reviewed,fingerprint,decorate};
  render();
})();

</script>
