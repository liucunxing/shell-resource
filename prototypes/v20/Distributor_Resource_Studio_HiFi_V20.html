/* ===================== V15 · 视觉系统 ===================== */
:root{--ink:#1F2D3A;--muted:#66788A;--line:#E3E8ED;--bg:#F4F6F8;--inv:#D9A400;--out:#5B7083;--good:#1E8E5A;--mid:#B7791F;--bad:#C53030}
body{color:var(--ink)}
.tiny{font-size:11px;color:#7D8C99}.tiny2{font-size:11px;color:#7D8C99;line-height:1.5}
th{font-size:11px;color:#6B7B88;font-weight:600;background:#F7F9FA;padding:9px 12px}
td{padding:9px 12px;vertical-align:middle}
table.mini td,table.mini th{padding:8px 10px}
.panel{border-color:var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.panel h2{font-size:17px;letter-spacing:-.2px}
.panel h3{font-size:13px;margin:4px 0 8px;color:#2B3A47}
.sub{color:#6B7B88}
/* 去掉深色底 */
.demostrip{background:#fff;color:var(--ink);border:1px solid var(--line);border-left:4px solid #FBCE07}
.demostrip p{color:#6B7B88}
.demostrip button{background:#fff}
.card.dark,.kpi.dark{background:#fff;color:var(--ink);border-color:var(--line)}
.card.dark .label,.card.dark .sub{color:#6B7B88}
.card.dark{border-top:3px solid #FBCE07}
.hero,.hero2,.healthbanner{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)}
.card{border:1px solid var(--line);border-radius:11px;background:#fff}
.card .label{color:#6B7B88;font-size:12px}
.card .value{font-size:24px;font-variant-numeric:tabular-nums}
.splitnum{font-size:22px}
/* 图例与色块 */
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0;flex-shrink:0}
.sw.lg{width:12px;height:12px;margin-right:10px}
.clg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:11px;color:#56697A;margin:6px 0}
.clg .ln{display:inline-block;width:18px;height:0;border-top:2.5px solid;margin-right:6px;vertical-align:3px}
.clg .ln.inv{border-color:var(--inv)}.clg .ln.out{border-color:var(--out)}.clg .ln.dg{border-top:1.5px dashed #B9C4CD}
.clg .mk,.dots .mk{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.mk.inv{background:var(--inv);box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #A88000}
.mk.vol{background:#8FA3B3;border-radius:2px;transform:rotate(45deg) scale(.85)}
.mk.out{background:#fff;border:2px solid var(--out)}
.clg .bx{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:6px}
.bx.inv{background:var(--inv)}.bx.vol{background:#8FA3B3}.bx.out{background:#C9D3DB}
.kinv{color:#A88000;font-weight:600}.kout{color:var(--out);font-weight:600}
/* 环形图 */
.donut{display:block;flex-shrink:0}
.donut .dc1{font-size:20px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.donut .dc2{font-size:10.5px;fill:#7D8C99}
.lgt{width:100%;border-collapse:collapse}
.lgt td{padding:7px 6px;border-bottom:1px solid #F0F3F5;font-size:12.5px}
.lgt tr:last-child td{border-bottom:0}
.lgt .lgn>div{display:flex;align-items:center}
.lgt .lgn small{display:block;font-size:10.5px;color:#8A98A4}
.lgt .lgp{color:#56697A;width:60px}
.lgt b{font-size:14px;font-variant-numeric:tabular-nums}
.ovgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.ovgrid.one{grid-template-columns:minmax(0,640px)}
.ovcell{border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.ovt{font-size:12px;font-weight:600;color:#56697A;margin-bottom:10px;letter-spacing:.2px}
.ovbody{display:flex;gap:22px;align-items:center}
.ovbody .lgt{flex:1}
.ovtail{margin-top:18px}
/* 100% 堆叠细条 */
.s100{display:flex;width:100%;border-radius:4px;overflow:hidden;background:#EEF2F5}
.s100 i{display:block;height:100%}
.s100.empty{height:8px}
/* 发散条 */
.dv{position:relative;height:12px;background:linear-gradient(90deg,transparent calc(50% - .5px),#C7D0D8 calc(50% - .5px),#C7D0D8 calc(50% + .5px),transparent calc(50% + .5px)),#F4F6F8;border-radius:3px;flex:1;min-width:90px}
.dv .dvb{position:absolute;top:2px;bottom:2px;border-radius:2px}
.dvcell{display:flex;align-items:center;gap:10px}
.dvcell b{min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.dvaxis,.dbaxis{display:flex;justify-content:space-between;font-size:9.5px;color:#9AA8B3;font-weight:400;margin-top:3px}
/* 哑铃图 */
.db{position:relative;height:14px;background:linear-gradient(90deg,#E6EBEF 1px,transparent 1px) 0 0/25% 100%,#F7F9FA;border-radius:3px;border-right:1px solid #E6EBEF}
.db .dbl{position:absolute;top:6px;height:2px;border-radius:2px}
.db .dbi,.db .dbo{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:50%}
.db .dbi{background:var(--inv);box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #A88000;z-index:2}
.db .dbo{background:#fff;border:2px solid var(--out);z-index:1}
/* 点图（SD） */
.dots{position:relative;height:16px;background:linear-gradient(90deg,#E6EBEF 1px,transparent 1px) 0 0/50% 100%,#F7F9FA;border-radius:3px;border-right:1px solid #E6EBEF}
.dots .mk{position:absolute;top:3px;margin-left:-5px}
.dots .mk.inv{z-index:3}.dots .mk.out{z-index:2}
.sdtab tr.cur td{background:#FFFBEA}
/* 集中度曲线 */
.curve{width:100%;height:auto;display:block}
.curve .cg{stroke:#EDF1F4;stroke-width:1}
.curve .ct{font-size:10px;fill:#8A98A4}
.curve .ctx{font-size:10.5px;fill:#6B7B88}
.curve .ctm{font-size:10px;fill:#56697A;font-weight:600}
.curve .carea{fill:rgba(217,164,0,.14)}
.curve .cdiag{stroke:#C4CDD5;stroke-width:1;stroke-dasharray:4 4}
.curve .cl1{fill:none;stroke:var(--inv);stroke-width:2.6;stroke-linejoin:round}
.curve .cl2{fill:none;stroke:var(--out);stroke-width:2;stroke-linejoin:round}
.curve .cm{stroke:#9AA8B3;stroke-width:1;stroke-dasharray:3 3}
.curve .ci{fill:var(--inv);stroke:#fff;stroke-width:1.5}
.curve .co{fill:#fff;stroke:var(--out);stroke-width:2}
.curve .cla{font-size:12px;font-weight:700;fill:#8A6A00}
.curve .clm{font-size:12px;font-weight:700;fill:var(--out)}
.ctab tr.cur td{background:#FFFBEA}
/* 提示条（浅色） */
.callout{border:1px solid var(--line);border-left:4px solid var(--good);background:#fff;border-radius:10px;padding:12px 16px;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.callout.mid{border-left-color:var(--mid);background:#FFFCF3}.callout.bad{border-left-color:var(--bad);background:#FFF8F7}
.callout .sep{color:#C4CDD5}.callout .cnote{flex-basis:100%;font-size:12px;color:#6B5A1E}
.ovconc{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:22px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.tiles{display:grid;gap:10px}
.tile{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border:1px solid var(--line);border-left:4px solid var(--good);border-radius:10px;padding:10px 14px;background:#fff}
.tile span{grid-column:1/-1;font-size:11px;color:#6B7B88}
.tile b{font-size:20px;font-variant-numeric:tabular-nums}.tile b small{font-size:11px;font-weight:400;color:#6B7B88}
.tile em{font-style:normal;font-size:12px;color:var(--out);grid-column:1}
.tile strong{grid-row:2/4;grid-column:2;align-self:center;font-size:17px}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.catcard{border:1px solid var(--line);border-top:3px solid #ccc;border-radius:12px;padding:14px 16px;background:#fff;cursor:pointer;box-shadow:none}
.catcard:hover,.catcard:focus-visible{border-color:#D4B537;box-shadow:0 2px 10px rgba(16,24,40,.06)}
.cathead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.cathead b{font-size:15px}.cathead small{display:block;font-size:11px;color:#7D8C99;margin-top:2px}
.catbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:center}
.catfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:#56697A}
.catfoot .go{color:#2F6B92;font-weight:600}
/* 部门：集中度块 */
.hblock{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px;background:#fff}
.concgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
.headline{font-size:14px;line-height:1.7}
.hv{font-size:22px;font-weight:800;margin:0 2px;font-variant-numeric:tabular-nums}
.hv.inv{color:#A88000}.hv.out{color:var(--out)}.hv.bad{color:var(--bad)}
.hnote{margin-top:10px;padding:8px 12px;border-radius:8px;background:#FFF7DD;color:#6B5000;font-size:12px}
.nh{margin-top:6px}
.itab td{vertical-align:middle}
.drawconc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px}
.mixbox{background:#FAFBFC;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:6px 0 4px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.mixbox .msg{flex:1;min-width:280px;font-size:13.5px;line-height:1.8}
.mixdonuts{display:flex;gap:16px;align-items:center}
.mixlg{display:grid;gap:5px;font-size:12px;min-width:160px}
.mixlg>div{display:flex;align-items:center}
.mixlg span{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:12px}
.mixlg small{color:#9AA8B3}

function amount(n){return wan(n)+'<small> 万</small>'}
function empty(title,desc,button=''){return `<div class="emptyhero"><strong>${title}</strong><p>${desc}</p>${button}</div>`}
function versionSelect(id='version',value=st.version,all=false){return `<select id="${id}" aria-label="数据版本">${db.versions.filter(v=>all||st.role==='admin'||v.published).map(v=>`<option value="${v.id}" ${v.id===value?'selected':''}>${v.id} · ${esc(v.name)}</option>`).join('')}</select>`}
function strip(extra=''){return `<div class="versionstrip"><div class="row">${versionSelect()}${extra}</div></div>`}
function nav(){let list=st.role==='owner'?[['home','我的 Initiative'],['portfolio','我的投入组合'],['work','拆分工作台'],['health','Proposal合理性体检'],['submit','草稿与提交']]:st.role==='admin'?[['versions','版本与发布'],['catalog','本版项目配置'],['audit','工作区与审计']]:[['home',st.role==='dept'?'部门投入组合':'全局投资看板'],['health','Proposal合理性体检']];$('#sidebar').innerHTML='<div class="navlabel">RESOURCE STUDIO / 2027 OP</div>'+list.map(([v,n])=>`<button type="button" class="navitem ${(st.role==='admin'?st.adminTab===v:st.view===v)?'active':''}" data-nav="${v}">${n}</button>`).join('')+'<div class="sidefoot"><strong>01 预算去了哪里</strong><br>已分配 / 未分配<br><br><strong>02 分布是否有依据</strong><br>串联项目 / 串联部门<br><br><strong>03 历史与占比明细</strong><br>合同 · Actual · 历史投资<br><br>合成模拟数据 · 非生产系统</div>'}
function render(){if(!ver())st.version=db.versions[0].id;if(st.role!=='admin'&&!ver().published){let v=db.versions.find(v=>v.published);if(v)st.version=v.id}if(!own().some(i=>i.id===st.id)&&own().length)st.id=own()[0].id;nav();$$('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===st.role));let html=st.role==='admin'?admin():st.role==='owner'?(st.view==='health'?healthPage():st.view==='portfolio'?ownerPortfolio():st.view==='work'?work():st.view==='submit'?submitPage():home()):dashboard();$('#main').innerHTML=`<div class="demostrip"><div><strong>Resource Studio V17 · 预算去向 · 投入分布 · 合理性体检</strong><p>${st.demo?'演示沙盒 · 全部为模拟数据，退出恢复原工作区。':'版本化规划 · Owner看工作草稿，管理层只看已提交方案。'}</p></div><div class="row">${st.demo?'<button data-action="exitdemo">退出沙盒</button>':'<button class="primary" data-action="demo">载入组合演示数据</button>'}<button data-action="help">指标与红绿灯口径</button></div></div>`+html}
function home(){let mine=own(),rows=mine.slice((st.ownerPage-1)*9,st.ownerPage*9),b=sum(mine.map(c=>c.budget)),a=sum(mine.map(c=>allocated(draft(st.version,c.id)))),r=sum(mine.map(c=>reserved(draft(st.version,c.id))));return heading('OWNER / MY INITIATIVES','预算分到哪里，还有多少没分？','先选择工作版本与本人负责范围。单项拆分与跨Initiative组合使用同一份工作草稿。')+strip((typeof ownerFilters==='function'?ownerFilters():'')+'<button class="primary home-portfolio" data-nav="portfolio">查看我的投入组合 →</button>')+moneyOverview(b,a,r,b-a-r,'工作草稿')+`<div class="panelhead"><h2>我的 Initiative</h2><span class="tiny">草稿与提交分开；不同版本清单和预算独立</span></div><div class="grid3">${rows.map(c=>{let d=draft(st.version,c.id),s=submitted(st.version,c.id);return `<div class="card initcard"><div class="init-title"><h2>${esc(c.name)}</h2>${typeof statusBadge==='function'?statusBadge(c):`<span class="pill ${s?'green':'gray'}">${s?'已提交 V'+s.revision:d.status}</span>`}</div><div class="sub">${c.sector} / ${c.dept} · ${esc(c.type)}</div><div class="amount">${wan(c.budget)} <small class="sub">万元</small></div><div class="metricline"><span>已分配</span><strong>${wan(allocated(d))} 万</strong></div><div class="metricline"><span>预留 / 待分配</span><strong>${wan(reserved(d))} / ${wan(pending(c,d))} 万</strong></div><button class="primary" style="width:100%;margin-top:12px" data-open="${c.id}">进入拆分 →</button></div>`}).join('')||empty('本版无本人负责项目','请切换Owner或范围。')}</div>${pager('owner',st.ownerPage,Math.max(1,Math.ceil(mine.length/9)),mine.length,9)}`}
function pager(type,p,pages,total,size){return `<div class="pagination"><span class="tiny">${total} 条 · 每页${size}条</span><div class="row"><button class="small" data-page="${type}" data-delta="-1" ${p<=1?'disabled':''}>上一页</button><span class="tiny">${p} / ${pages}</span><button class="small" data-page="${type}" data-delta="1" ${p>=pages?'disabled':''}>下一页</button></div></div>`}
function budgetCards(c,d){let rest=pending(c,d);return `<div class="cards work-budget-cards">${card('本版总预算',amount(c.budget),'这个项目在当前版本可用的全部预算',true)}${card('预留不分配',amount(reserved(d)),'暂不分给经销商的钱；每笔需说明原因')}${card('当前已分配',amount(allocated(d)),'草稿中已分给经销商的钱，提交后上级才会看到')}${card(rest<0?'超出预算':'待分配',`<span class="${rest<0?'negative':rest===0?'positive':''}">${amount(Math.abs(rest))}</span>`,rest===0?'预算已全部安排好，可继续检查并提交':rest<0?'已分配加预留超过总预算，请减少金额':'还没安排的钱，可继续分配或填写原因后预留')}</div>`}
function work(){let c=currentConfig(),d=current();if(!c||!own().some(i=>i.id===c.id))return home();return heading('OWNER / '+st.version,esc(c.name),`${c.id} · ${c.sector} · ${c.dept} · ${st.owner}`)+`<div class="work-version-context"><span>当前版本 <strong>${esc(st.version)} · ${esc(ver().name)}</strong></span><span class="pill ${ver().open&&!closedByTime()?'green':'gray'}">${ver().open&&!closedByTime()?'开放提交':'已关闭提交'}</span></div><div class="steps">${['预算与预留','经销商范围','试算、微调与提交'].map((n,i)=>`<button data-step="${i+1}" class="${st.step===i+1?'active':''}"><span class="stepnum">${i+1}</span>${n}</button>`).join('')}</div><div id="budgetcards" role="region" aria-label="项目预算概况">${budgetCards(c,d)}</div><div id="stepbody">${st.step===1?budgetStep(c,d):st.step===2?scopeStep(c,d):planningStep(c,d)}</div><div class="stickyactions"><button data-action="back">← ${st.step===1?'返回项目':'上一步'}</button><span class="tiny">${st.version} · 总预算 = 预留 + 已分配 + 待分配</span><div class="row"><button data-action="save">保存草稿</button>${st.step<3?'<button class="primary" data-action="next">下一步 →</button>':`<button class="primary" data-action="submitone" ${!ver().open?'disabled':''}>提交到 ${st.version} →</button>`}</div></div>`}
function budgetStep(c,d){return `<div class="panel"><div class="panelhead"><h2>多笔预留 · 原因与金额</h2></div><div class="tablewrap"><table><thead><tr><th>原因 / 用途</th><th class="num">金额（元）</th><th class="reserve-actions">操作</th></tr></thead><tbody>${d.reserves.map((r,i)=>`<tr><td><input data-reason="${i}" value="${esc(r.reason)}" aria-label="预留原因" style="width:100%"></td><td class="num"><input type="number" min="0" step="1" data-reserve="${i}" value="${r.amount}" aria-label="预留金额"></td><td class="reserve-actions"><button type="button" class="reserve-icon" data-action="addreserve" aria-label="添加预留" title="添加预留">＋</button><button type="button" class="reserve-icon" data-delreserve="${i}" aria-label="删除当前行预留" title="删除当前行预留"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg></button></td></tr>`).join('')||'<tr><td colspan="3" class="reserve-empty"><button type="button" class="small" data-action="addreserve">＋ 添加预留</button></td></tr>'}</tbody></table></div><div class="reserve-intro"><strong>先定义预留，再拆分能明确到经销商的预算。</strong><p>暂不能明确对象或用途的部分，请设置预留并说明原因。允许有原因的100%预留，不为了配平强行分摊。预留不会因手工微调自动消耗。</p></div></div><div class="panel"><h2>调整依据说明</h2><input id="changeReason" value="${esc(d.changeReason)}" maxlength="160" placeholder="说明本版名单、金额或预留变化原因" style="width:100%;margin-top:14px"></div>`}
function filtered(){let q=st.search.toLowerCase();return SEED.dealers.filter(d=>(!q||(d.id+d.name).toLowerCase().includes(q))&&(!st.dealerSD||d.sd===st.dealerSD)&&(!st.rsm||d.rsm===st.rsm)&&(!st.status||d.status===st.status))}
function scopeStep(c,d){let rows=filtered();return `<div class="panel"><div class="panelhead"><div><h2>定义适用经销商</h2><div class="sub">只引用底层经销商库，不创建新主数据。名单变化不静默重算金额。</div></div><span class="pill">已选 ${d.selected.length} 家</span></div><div class="searchrow"><input id="dealersearch" type="search" value="${esc(st.search)}" placeholder="搜索编码 / 名称" aria-label="搜索经销商"><select id="dealerSD" aria-label="SD"><option value="">全部SD</option>${colOptions(['SD-A','SD-B','SD-C','SD-D'],st.dealerSD)}</select><select id="rsm"><option value="">全部RSM</option>${colOptions([...new Set(SEED.dealers.map(d=>d.rsm))],st.rsm)}</select><select id="dealerstatus"><option value="">全部状态</option>${colOptions(['active','newclose','closed'],st.status)}</select></div><div class="tablewrap" style="max-height:330px"><table><thead><tr><th>选择</th><th>编码</th><th>经销商名称</th><th>SD</th><th>RSM</th><th>状态</th></tr></thead><tbody>${rows.map(x=>`<tr><td><input type="checkbox" data-select="${x.id}" ${d.selected.includes(x.id)?'checked':''} aria-label="选择${esc(x.name)}"></td><td>${x.id}</td><td>${esc(x.name)}</td><td>${x.sd}</td><td>${x.rsm}</td><td><span class="pill ${x.status==='active'?'green':'gray'}">${x.status}</span></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="panelhead"><h2>最终名单 · ${d.selected.length} 家</h2><div class="row"><button data-action="library">＋ 从库添加一行</button><button data-action="rosterdown">↓ 名单Excel</button><button data-action="rosterup">↑ 上传名单</button></div></div><div class="tablewrap" style="max-height:330px"><table><thead><tr><th>编码</th><th>名称</th><th>SD</th><th>RSM</th><th>状态</th><th class="num">已分配（元）</th><th></th></tr></thead><tbody>${d.selected.map(id=>{let x=SEED.dealers.find(x=>x.id===id);return `<tr><td>${id}</td><td>${esc(x.name)}</td><td>${x.sd}</td><td>${x.rsm}</td><td>${x.status}</td><td class="num">${fmt(d.amounts[id]||0)}</td><td><button class="small quiet" data-remove="${id}">移除</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">尚未选择经销商</td></tr>'}</tbody></table></div><div class="chartnote">名单Excel与金额Excel分开。移除已获配经销商需确认，释放金额返回待分配。</div></div>`}
const methods=[['v25','Delivery Vol','2025Delivery Vol占比'],['c25','C3','2025 C3占比'],['r25','Resource','2025全部Resource占比']];
function allocate(c,d,k){let rows=d.selected.map(id=>SEED.dealers.find(x=>x.id===id)),target=c.budget-reserved(d),map={v25:'vol',c25:'c3',r25:'investment'},metric=map[k]||k,weights=rows.map(x=>Math.max(0,hist(x)[metric]||0)),total=sum(weights);if(!total||target<0||!Number.isSafeInteger(target))return null;let out={},remain=target,rank=[];rows.forEach((x,i)=>{let raw=target*weights[i]/total,n=Math.floor(raw);out[x.id]=n;remain-=n;if(weights[i]>0)rank.push({id:x.id,tail:raw-n})});rank.sort((a,b)=>b.tail-a.tail);for(let i=0;i<remain;i++)out[rank[i%rank.length].id]++;return out}
function planningStep(c,d){let rows=d.selected.map(id=>SEED.dealers.find(x=>x.id===id));return `<div class="panel" id="trialpanel"><div class="panelhead"><div><h2>试算与微调 · 在同一张表里决定投向</h2><div class="sub">金额、历史表现、投资构成和占比差值并排。试算基于当前选择的历史期间。</div></div><span class="pill">当前采用 ${esc(d.method||'尚未采用')}</span></div>${periodControl()}<div class="trialtools">${[['vol','Actual Delivery Vol'],['c3','Actual C3'],['investment','历史投资总额']].map(([k,n])=>`<button data-adopt="${k}" ${!rows.length?'disabled':''}>按${n}试算并采用</button>`).join('')}<span class="tiny">覆盖当前金额前会确认；无权重不自动分配</span></div><div class="row between"><div class="tiny">${rows.length} 家 · 可分配 ${wan(c.budget-reserved(d))} 万 · 当前金额以整数元编辑</div><div class="row"><button class="small" data-action="moneydown">↓ 完整金额Excel</button><button class="small" data-action="moneyup">↑ 上传完整方案</button><button class="small" data-action="balance">指定对象配平</button></div></div><div id="ownerhealth">${ownerHealthStrip(c,d)}</div><div id="unifiedtable">${unifiedTable(rows,d.amounts,true,[{...c,...d}])}</div></div>`}
function aggregate(rows,am,k){return [...new Set(rows.map(x=>x[k]))].map(n=>{let a=rows.filter(x=>x[k]===n);return {name:n,n:a.length,v24:sum(a.map(x=>x.v24)),v25:sum(a.map(x=>x.v25)),c24:sum(a.map(x=>x.c24)),c25:sum(a.map(x=>x.c25)),amount:sum(a.map(x=>am[x.id]||0))}})}
function structure(rows,am,k,click=false){let names=[...new Set(rows.map(x=>x[k]))],at=sum(rows.map(x=>am[x.id]||0)),vt=sum(rows.map(x=>hist(x).vol)),ct=sum(rows.map(x=>hist(x).c3));return `<div class="legend"><span><i class="dot" style="background:#fbd000"></i>当前投资金额占比</span><span><i class="dot" style="background:#537c96"></i>${st.period==='2025'?'2025':'2026 YTD'}Delivery Vol占比</span><span><i class="dot" style="background:#a7b8c6"></i>C3占比</span></div><div class="comparegrid" style="margin-top:14px">${names.map(n=>{let ds=rows.filter(x=>x[k]===n),a=sum(ds.map(x=>am[x.id]||0)),v=sum(ds.map(x=>hist(x).vol)),c=sum(ds.map(x=>hist(x).c3));return `<div class="comparecard ${click&&st.sd===n?'selected':''}">${click?`<button data-sd="${n}">`:''}<div class="comparehead"><strong>${esc(n)}</strong><b>${wan(a)} <small class="tiny">万</small></b></div><div class="triple">${[['投入',a,at,''],['Delivery Vol',v,vt,'blue'],['C3',c,ct,'gray']].map(([label,value,total,color])=>`<span>${label}</span><div class="track ${color}"><span style="width:${total?value/total*100:0}%"></span></div><span class="num">${pct(value,total)}</span>`).join('')}</div><div class="chartnote">投资金额−C3 ${at&&ct?fmt((a/at-c/ct)*100,1)+'pp':'—'}${click?' · 点击展开项目 →':''}</div>${click?'</button>':''}</div>`}).join('')}</div>`}
function validate(c,d){let e=[];if(!ver().open||!ver().published)e.push('当前版本未发布或关闭提交');if(pending(c,d)!==0)e.push('待分配金额须为0');if(d.reserves.some(r=>r.amount>0&&!r.reason.trim()))e.push('预留必须填写原因');if(reserved(d)>c.budget)e.push('预留超预算');if(allocated(d)>0&&!d.selected.length)e.push('缺少经销商名单');if(Object.values(d.amounts).some(n=>!Number.isSafeInteger(n)||n<0))e.push('分配须为非负整数元');if(d.selected.some(id=>!SEED.dealers.some(x=>x.id===id)))e.push('名单含库外编码');if(Object.keys(d.amounts).some(id=>!d.selected.includes(id)))e.push('金额含名单外编码');return e}
function submitPage(){let mine=own();return heading('OWNER / DRAFT & SUBMISSION','当前版本的草稿与提交','先选版本再拆分，不再把同一份草稿任意提交到不同预算版本。')+strip()+`<div class="panel"><div class="panelhead"><h2>${st.version} · ${st.owner}</h2><button class="primary" data-action="submitvalid">提交本版所有已配平项目</button></div><div class="tablewrap"><table><thead><tr><th>Initiative</th><th class="num">本版预算（万）</th><th class="num">已分配</th><th class="num">预留</th><th class="num">待分配</th><th>提交状态</th><th></th></tr></thead><tbody>${mine.map(c=>{let d=draft(st.version,c.id),s=submitted(st.version,c.id);return `<tr><td>${esc(c.name)}<div class="tiny">${c.id}</div></td><td class="num">${wan(c.budget)}</td><td class="num">${wan(allocated(d))}</td><td class="num">${wan(reserved(d))}</td><td class="num">${wan(pending(c,d))}</td><td>${s?'已提交 V'+s.revision:'未提交'}</td><td><button class="small" data-open="${c.id}">编辑</button></td></tr>`}).join('')}</tbody></table></div><div class="notice yellow">提交覆盖仅限当前版本选中的项目；保留修订审计。已取消项目不显示为待提交，历史版本不被删除。</div></div>`}
function scopeConfig(v=st.version,reviewMode=false){let sec=reviewMode?st.reviewSector:st.sector,dep=reviewMode?st.reviewDept:st.dept;return cat(v).filter(c=>c.enabled&&(st.role==='dept'?(c.sector===st.sector&&c.dept===st.dept):st.role==='owner'&&reviewMode?c.owner===st.owner&&(st.ownerSector==='all'||c.sector===st.ownerSector)&&(st.ownerDept==='all'||c.dept===st.ownerDept):(sec==='all'||c.sector===sec)&&(dep==='all'||c.dept===dep)))}
function scoped(v=st.version,rev=false){return scopeConfig(v,rev).map(c=>{let s=submitted(v,c.id);return {...c,amounts:s?.amounts||{},reserves:s?.reserves||[],method:s?.method||'',notes:s?.notes||{},included:!!s,revision:s?.revision||0,submittedAt:s?.submittedAt||'',changeReason:s?.changeReason||''}})}
function combine(items){let out={};items.forEach(i=>Object.entries(i.amounts||{}).forEach(([id,n])=>out[id]=(out[id]||0)+n));return out}
function filters(){return `<label>Sector</label><select id="sector">${colOptions(st.role==='dept'?['PCMO','CRTO','B2B','OEM']:['all','PCMO','CRTO','B2B','OEM'],st.sector)}</select><label>Department</label><select id="dept">${colOptions(st.role==='dept'?['MKT','ICE','Capex']:['all','MKT','ICE','Capex'],st.dept)}</select>`}
function dashboard(){let all=scoped(),items=all.filter(i=>i.included),am=combine(items),b=sum(all.map(i=>i.budget)),a=sum(items.map(allocated)),r=sum(items.map(reserved)),u=sum(all.filter(i=>!i.included).map(i=>i.budget));return heading(st.role==='exec'?'EXECUTIVE / GLOBAL DISTRIBUTION':'DEPARTMENT / INITIATIVE PORTFOLIO',st.role==='exec'?'全局投资看板':'部门投入组合','统一回答：预算去了哪里、分布是否有依据、历史与投资金额占比如何对照。管理层只读，未提交预算单列。')+strip(filters())+moneyOverview(b,a,r,u,'当前版本配置 · '+items.length+'/'+all.length+' 已提交')+destinationPanel(items,b,a,r,u)+(st.role==='exec'?categoryPanel(all,items):departmentPanels(all,items,am,SEED.dealers))+(items.length?distributionPanel(items,st.role==='exec'?'dept':'initiative'):'')+`<div class="panel"><div class="panelhead"><div><h2>03 / 经销商累计投资金额分析</h2><div class="sub">合同信息 · Actual信息 · 历史投资 · 占比差值与平均水平对照</div></div><span class="pill gray">只读 · 已提交口径</span></div>${periodControl()}<div id="unifiedtable">${unifiedTable(SEED.dealers,am,false,items)}</div></div><div class="footnote">占比差值是分布偏离提示，不是合理性评分。历史表现不等于未来回报；历史投资/C3不是某个Initiative的因果ROI。</div>`}
function departmentPanels(all,items,am,rows){let pages=Math.max(1,Math.ceil(all.length/8));st.projectPage=Math.min(st.projectPage,pages);return `<div class="panel"><div class="panelhead"><div><h2>01 / 项目进度与覆盖</h2><div class="sub">纵向分页，适配20+Initiative；只看本部门、本Sector。</div></div><span class="pill green">${items.length} / ${all.length} 已提交</span></div><div class="tablewrap"><table><thead><tr><th>Initiative / Owner</th><th class="num">预算（万）</th><th>预算结构</th><th class="num">获配经销商</th><th>拆分依据</th><th>状态</th></tr></thead><tbody>${all.slice((st.projectPage-1)*8,st.projectPage*8).map(i=>`<tr><td><button class="quiet small link" data-project="${i.id}">${esc(i.name)}</button><div class="tiny">${i.owner}</div></td><td class="num">${wan(i.budget)}</td><td style="min-width:170px"><div class="bartrack"><span style="width:${allocated(i)/i.budget*100}%;background:#fbd000"></span><span style="width:${reserved(i)/i.budget*100}%;background:#a7b8c6"></span></div><div class="tiny">分配 ${wan(allocated(i))} · 预留 ${wan(reserved(i))}</div></td><td class="num">${Object.values(i.amounts).filter(n=>n>0).length}</td><td>${methodPill(i)}</td><td><span class="pill ${i.included?'green':'gray'}">${i.included?'已提交 V'+i.revision:'未提交'}</span></td></tr>`).join('')}</tbody></table></div>${pager('project',st.projectPage,pages,all.length,8)}</div><div class="panel"><div class="panelhead"><div><h2>02 / SD横向比较 → Initiative构成</h2><div class="sub">点击SD卡片，下方展开该SD获得的项目支持；避免20+列横向矩阵。</div></div></div>${structure(rows,am,'sd',true)}<div class="divider"></div><div id="sdprojects">${sdProjects(items,rows)}</div></div>`}
function sdProjects(items,rows){let sd=st.sd,ds=rows.filter(x=>x.sd===sd),arr=items.map(i=>({i,n:sum(ds.map(x=>i.amounts[x.id]||0))})).sort((a,b)=>b.n-a.n),max=Math.max(1,...arr.map(x=>x.n)),total=sum(arr.map(x=>x.n));return `<div class="panelhead"><h3>${sd} · 项目构成</h3><span class="tiny">该SD合计 ${wan(total)} 万 · 点击项目查看详情</span></div><div class="projectlist">${arr.map(({i,n})=>`<div class="projectrow"><button class="link" data-project="${i.id}">${esc(i.name)}<div class="tiny">${i.owner}</div></button><div><div class="track"><span style="width:${n/max*100}%"></span></div><div class="tiny" style="margin-top:4px">该SD内部占比 ${pct(n,total)}</div></div><strong class="num">${wan(n)} 万</strong></div>`).join('')}</div>`}
function ring(parts,total,center,label){let stop=0,colors=['#fbd000','#91a6b7','#dce3e9','#f1f3f5'];let gradient=parts.map((p,i)=>{let a=stop;stop+=total?p[1]/total*100:0;return colors[i%4]+' '+a+'% '+stop+'%'}).join(',');return `<div class="ringlayout"><div class="ring" style="background:conic-gradient(${gradient||'#edf1f4 0 100%'})"><div class="ringcenter"><strong>${center}</strong><small>${label}</small></div></div><div class="ringlegend">${parts.map(([n,v],i)=>`<div><span><i class="dot" style="background:${colors[i%4]}"></i>${n}</span><b>${wan(v)} 万</b></div>`).join('')}</div></div>`}
function reserveReasons(items){let g={};items.forEach(i=>i.reserves.forEach(r=>g[r.reason]=(g[r.reason]||0)+r.amount));let arr=Object.entries(g).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...arr.map(x=>x[1]));return arr.map(([n,v])=>`<div class="barline wide"><span>${esc(n)}</span><div class="track gray"><span style="width:${v/max*100}%"></span></div><strong class="num">${wan(v)} 万</strong></div>`).join('')||'<div class="emptyinline">暂无已提交预留</div>'}
function diffData(now,prev,rev=false){let filter=c=>st.role==='owner'&&rev?c.owner===st.owner&&(st.ownerSector==='all'||c.sector===st.ownerSector)&&(st.ownerDept==='all'||c.dept===st.ownerDept):st.role==='dept'?c.sector===st.sector&&c.dept===st.dept:((rev?st.reviewSector:st.sector)==='all'||c.sector===(rev?st.reviewSector:st.sector))&&((rev?st.reviewDept:st.dept)==='all'||c.dept===(rev?st.reviewDept:st.dept));let a=cat(now).filter(x=>x.enabled&&filter(x)),b=cat(prev).filter(x=>x.enabled&&filter(x)),ids=[...new Set([...a,...b].map(x=>x.id))];return ids.map(id=>{let n=a.find(x=>x.id===id),p=b.find(x=>x.id===id),ns=submitted(now,id),ps=submitted(prev,id),delta=(n?.budget||0)-(p?.budget||0),type=!p?'新增':!n?'取消':delta>0?'预算增加':delta<0?'预算减少':'预算不变';return {id,n,p,ns,ps,delta,type,allocDelta:ns&&ps?allocated(ns)-allocated(ps):null,resDelta:ns&&ps?reserved(ns)-reserved(ps):null,gross:ns&&ps?sum(SEED.dealers.map(d=>Math.abs((ns.amounts[d.id]||0)-(ps.amounts[d.id]||0)))):null}}).sort((a,b)=>st.diffSort==='allocation'?Math.abs(b.allocDelta||0)-Math.abs(a.allocDelta||0):st.diffSort==='reserve'?Math.abs(b.resDelta||0)-Math.abs(a.resDelta||0):st.diffSort==='movement'?(b.gross||0)-(a.gross||0):Math.abs(b.delta)-Math.abs(a.delta))}
function diffPanel(now,prev,rev){if(!ver(prev)||now===prev)return '';let rows=diffData(now,prev,rev),nb=sum(rows.map(x=>x.n?.budget||0)),pb=sum(rows.map(x=>x.p?.budget||0)),added=rows.filter(x=>x.type==='新增'),cancelled=rows.filter(x=>x.type==='取消'),inc=rows.filter(x=>x.p&&x.n&&x.delta>0),dec=rows.filter(x=>x.p&&x.n&&x.delta<0);let movement=dealerMovement(now,prev,rows);return `<div class="panel" id="versionchanges"><div class="panelhead"><div><h2>${rev?'本季度最大的版本变化':'版本变化与预算去向'}</h2><div class="sub">${prev} → ${now} · 按项目稳定编码比较 · 新增、取消、未提交分别识别</div></div><div class="row"><label>变化排序</label><select id="diffSort"><option value="budget" ${st.diffSort==='budget'?'selected':''}>预算变化最大</option><option value="allocation" ${st.diffSort==='allocation'?'selected':''}>分配总额变化最大</option><option value="reserve" ${st.diffSort==='reserve'?'selected':''}>预留变化最大</option><option value="movement" ${st.diffSort==='movement'?'selected':''}>经销商调整量最大</option></select><span class="pill">总盘 ${sign(nb-pb)} 万</span></div></div><div class="versiondiff">${[['新增项目',added.length,sign(sum(added.map(x=>x.delta)))+'万'],['取消项目',cancelled.length,sign(sum(cancelled.map(x=>x.delta)))+'万'],['存续增额',inc.length,sign(sum(inc.map(x=>x.delta)))+'万'],['存续减额',dec.length,sign(sum(dec.map(x=>x.delta)))+'万'],['净预算变化',sign(nb-pb)+'万',wan(pb)+' → '+wan(nb)+'万']].map(([n,v,t])=>`<div><span>${n}</span><b>${v}</b><span>${t}</span></div>`).join('')}</div><div class="notice">预算桥接：${wan(pb)} + 新增${wan(sum(added.map(x=>x.delta)))} − 取消${wan(-sum(cancelled.map(x=>x.delta)))} + 增额${wan(sum(inc.map(x=>x.delta)))} − 减额${wan(-sum(dec.map(x=>x.delta)))} = ${wan(nb)} 万。<br>未提交只影响分配可见性，不被当作预算减少。经销商调整量为逐家金额变化绝对值之和，可能包含增减双边，不等于净新增预算。</div><div class="tablewrap" style="max-height:360px"><table><thead><tr><th>Initiative / Owner</th><th>变化类型</th><th class="num">${prev} 预算</th><th class="num">${now} 预算</th><th class="num">预算变化（万）</th><th class="num">分配变化（万）</th><th class="num">预留变化（万）</th><th class="num">经销商调整量</th><th>变化原因 / 提交状态</th></tr></thead><tbody>${rows.map(x=>`<tr><td><button class="quiet small link" data-diff="${x.id}" data-now="${now}" data-prev="${prev}">${esc((x.n||x.p).name)}</button><div class="tiny">${(x.n||x.p).owner}</div></td><td><span class="pill ${x.type==='新增'?'green':x.type==='取消'?'warn':'gray'}">${x.type}</span></td><td class="num">${x.p?wan(x.p.budget):'—'}</td><td class="num">${x.n?wan(x.n.budget):'—'}</td><td class="num"><strong>${sign(x.delta)}</strong></td><td class="num">${x.allocDelta===null?'不可直接比较':sign(x.allocDelta)}</td><td class="num">${x.resDelta===null?'—':sign(x.resDelta)}</td><td class="num">${x.gross===null?'—':wan(x.gross)}</td><td class="tiny">${esc(x.n?.reason||cat(now).find(c=>c.id===x.id)?.reason||'本版取消')}<br>${x.n?(x.ns?now+' 已提交':now+' 未提交'):'取消，不是未提交'} · ${x.p?(x.ps?prev+' 已提交':prev+' 未提交'):prev+' 无此项目'}</td></tr>`).join('')}</tbody></table></div><div class="divider"></div><div class="panelhead"><h3>经销商投入变化 Top 5</h3><span class="tiny">仅比较两版均已提交的存续项目，排除提交缺口影响</span></div>${movement.slice(0,5).map(x=>`<div class="barline wide"><button class="quiet small link" data-dealer="${x.id}">${esc(x.name)}</button><div class="track ${x.delta<0?'red':'teal'}"><span style="width:${Math.abs(x.delta)/Math.max(1,...movement.map(x=>Math.abs(x.delta)))*100}%"></span></div><strong class="num">${sign(x.delta)} 万</strong></div>`).join('')||'<div class="tiny">两版尚无可比提交，不能把未提交解释为投入下降。</div>'}</div>`}
function dealerMovement(now,prev,rows){let both=rows.filter(x=>x.n&&x.p&&x.ns&&x.ps);return SEED.dealers.map(d=>({...d,delta:sum(both.map(x=>(x.ns.amounts[d.id]||0)-(x.ps.amounts[d.id]||0)))})).filter(x=>x.delta!==0).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta))}
function admin(){return heading('ADMINISTRATION / VERSION CONFIGURATION','版本与Initiative配置','保留按版本配置项目、预算与Owner；本版聚焦预算拆分和分布分析。','<button data-action="backup">下载工作区备份</button>')+`<div class="segmented configtabs">${[['versions','版本与发布'],['catalog','本版项目配置'],['audit','工作区与审计']].map(([v,n])=>`<button data-admintab="${v}" class="${st.adminTab===v?'active':''}">${n}</button>`).join('')}</div>`+(st.adminTab==='catalog'?adminCatalog():st.adminTab==='audit'?adminAudit():adminVersions())}
function adminVersions(){return `<div class="panel"><div class="panelhead"><div><h2>规划版本</h2><div class="sub">初始202612 / 202701；每个版本独立配置清单、预算与Owner。</div></div><button class="primary" data-action="newversion">＋ 从上版创建新版本</button></div><div class="tablewrap"><table><thead><tr><th>版本 / 来源</th><th>名称</th><th class="num">启用项目</th><th class="num">总预算（万）</th><th>发布 / 提交状态</th><th>操作</th></tr></thead><tbody>${db.versions.map(v=>`<tr><td><strong>${v.id}</strong><div class="tiny">来源 ${v.base||'初始'}</div></td><td>${esc(v.name)}</td><td class="num">${v.catalog.filter(i=>i.enabled).length}</td><td class="num">${wan(sum(v.catalog.filter(i=>i.enabled).map(i=>i.budget)))}</td><td><span class="pill ${v.published?'green':'gray'}">${v.published?'已发布':'配置中'}</span> <span class="pill gray">${v.open?'开放提交':'关闭提交'}</span></td><td><div class="row"><button class="small" data-configver="${v.id}">配置项目</button><button class="small" data-publish="${v.id}">${v.published?'撤回发布':'发布配置'}</button><button class="small" data-togglever="${v.id}">${v.open?'关闭提交':'开放提交'}</button></div></td></tr>`).join('')}</tbody></table></div><div class="notice yellow">新版本复制清单与上一版已提交方案作为草稿，不自动提交。预算改变后不自动缩放；新增项目从零开始；取消保留稳定编码与历史实际。</div></div>`}
function adminCatalog(){return strip()+`<div class="panel"><div class="panelhead"><div><h2>${st.version} · 项目清单与预算</h2><div class="sub">当前版本独立配置。修改已发布配置会撤回发布，重新发布后业务端可用。</div></div><button class="primary" data-action="newinit">＋ 本版新增Initiative</button></div><div class="tablewrap" style="max-height:580px"><table><thead><tr><th>编码 / Initiative</th><th>Sector</th><th>Department</th><th>Resource Type</th><th>Owner</th><th class="num">预算（万）</th><th>本版状态</th><th>操作</th></tr></thead><tbody>${cat().map(c=>`<tr><td>${esc(c.name)}<div class="tiny">${c.id}${c.predecessor?' · 承接 '+c.predecessor:''}</div></td><td>${esc(c.sector)}</td><td>${esc(c.dept)}</td><td>${esc(c.type)}</td><td>${c.owner}</td><td class="num">${wan(c.budget)}</td><td><span class="pill ${c.enabled?'green':'warn'}">${c.enabled?'启用':'本版取消'}</span></td><td><button class="small" data-editinit="${c.id}">编辑</button></td></tr>`).join('')}</tbody></table></div><div class="notice">本版预算变化需重新核对原草稿；已提交项目配置变更将清除本版最新提交并留审计，避免旧分配配上新预算。其他版本不受影响。</div></div>`}
function adminAudit(){return `<div class="panel"><h2>演示数据与本地备份</h2><p class="sub">工作模式从零开始；沙盒准备多项目、多部门模拟分配，退出恢复原数据。</p><div class="row"><button class="primary" data-action="demo">载入组合演示数据</button><button data-action="backup">下载备份</button><button data-action="restore">恢复备份</button><button data-action="reset">重置本地V6</button></div></div><div class="panel"><h2>操作审计</h2>${db.audit.slice(0,30).map(x=>`<div class="auditrow">${esc(x.text)}<div class="tiny">${esc(x.at)}</div></div>`).join('')||'<div class="empty">尚无记录</div>'}</div>`}
function modal(title,body,footer='<button data-action="close">关闭</button>',drawer=false){lastFocus=document.activeElement;$('#layer').innerHTML=drawer?`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row between"><h2>${title}</h2><button class="quiet" data-action="close" aria-label="关闭">✕</button></div><div class="divider"></div>${body}<div class="row" style="justify-content:flex-end;margin-top:20px">${footer}</div></section></div>`:`<div class="modalwrap"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row between"><h2>${title}</h2><button class="quiet" data-action="close" aria-label="关闭">✕</button></div><div class="divider"></div>${body}<div class="row" style="justify-content:flex-end;margin-top:20px">${footer}</div></section></div>`;$('#layer button')?.focus()}
function close(){ $('#layer').innerHTML='';lastFocus?.isConnected&&lastFocus.focus() }
function submitDialog(ids){let configs=ids.map(id=>cat().find(c=>c.id===id&&c.enabled&&c.owner===st.owner)).filter(Boolean),errors=configs.flatMap(c=>validate(c,draft(st.version,c.id)).map(e=>c.name+'：'+e));if(!configs.length){toast('没有可提交项目');return}if(errors.length){modal('提交前请完成检查','<div class="notice error">未提交任何数据。</div><ul>'+errors.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>');return}st.submitIds=configs.map(c=>c.id);modal('提交当前版本分配',`<span class="pill">${st.version} · ${esc(ver().name)}</span><div class="cards" style="grid-template-columns:1fr 1fr">${card('分配到经销商',amount(sum(configs.map(c=>allocated(draft(st.version,c.id))))),'提交后进入管理层组合')}${card('预留不分配',amount(sum(configs.map(c=>reserved(draft(st.version,c.id))))),'按原因单独展示')}</div><div class="notice yellow">覆盖当前版本选中项目最新提交，其他项目和版本不变。Owner草稿与管理层提交快照独立。</div>`,'<button data-action="close">取消</button><button class="primary" data-action="confirmsubmit">确认提交</button>')}

function diffDetail(id,now,prev){let n=cat(now).find(x=>x.id===id),p=cat(prev).find(x=>x.id===id),ns=submitted(now,id),ps=submitted(prev,id),rows=SEED.dealers.map(x=>({...x,old:ps?.amounts[x.id]||0,now:ns?.amounts[x.id]||0})).filter(x=>x.old||x.now).sort((a,b)=>Math.abs(b.now-b.old)-Math.abs(a.now-a.old));modal(esc((n||p).name)+' · 版本差异',`<div class="notice">${prev} → ${now} · ${esc(n?.reason||'本版取消')}<br>预算 ${p?.enabled?wan(p.budget):'无'} → ${n?.enabled?wan(n.budget):'取消'} 万。预留 ${ps?wan(reserved(ps)):'未提交'} → ${ns?wan(reserved(ns)):'未提交'} 万。</div>${ns&&ps?`<div class="tablewrap" style="max-height:440px"><table><thead><tr><th>经销商</th><th class="num">上版（万）</th><th class="num">本版（万）</th><th class="num">变化（万）</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${wan(x.old)}</td><td class="num">${wan(x.now)}</td><td class="num">${sign(x.now-x.old)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice yellow">至少一版未提交或本版取消，不能把缺少分配数据解释为投入变化。</div>'}`,undefined,true)}

function initForm(id){let c=id?cat().find(c=>c.id===id):null;st.editInit=id||'';modal(c?'编辑本版Initiative':'本版新增Initiative',`<span class="pill">当前配置版本 ${st.version}</span><div class="formgrid" style="margin-top:15px"><label class="field full">名称<input id="iname" value="${esc(c?.name||'')}" maxlength="60"></label><label class="field">Sector<select id="isector">${colOptions(['PCMO','CRTO','B2B','OEM'],c?.sector||'B2B')}</select></label><label class="field">Department<select id="idept">${colOptions(['MKT','ICE','Capex'],c?.dept||'MKT')}</select></label><label class="field">资源大类<select id="itype">${colOptions(['ICE Rebate','MRD','SP&A','Capex'],c?.type||'MRD')}</select></label><label class="field">Owner<select id="iowner">${colOptions(owners,c?.owner||'王磊')}</select></label><label class="field">本版预算（元）<input id="ibudget" type="number" min="1" step="1" value="${c?.budget||1000000}"></label><label class="field">本版状态<select id="ienabled"><option value="1" ${c?.enabled!==false?'selected':''}>启用</option><option value="0" ${c?.enabled===false?'selected':''}>本版取消</option></select></label><label class="field full">变化原因（必填）<input id="ireason" value="${esc(c?.reason||'')}" maxlength="160"></label><label class="field full">承接的历史项目编码（可选）<input id="ipredecessor" value="${esc(c?.predecessor||'')}" maxlength="20" placeholder="拆分/合并时记录来源，例如 INI-008"></label></div><div class="notice yellow">修改只作用于本版。若已有提交，变更将撤销该项目本版最新提交并保留审计；保留供Owner重新核对。配置需重新发布。</div><div id="formerror" class="negative"></div>`,'<button data-action="close">取消</button><button class="primary" data-action="saveinit">保存本版配置</button>')}

function seedDemo(){if(st.demo)return;sandbox={db:clone(db),st:clone(st)};st.demo=true;db.versions.forEach((v,vi)=>v.catalog.filter(c=>c.enabled).forEach((c,i)=>{let d={selected:SEED.dealers.filter((x,j)=>x.status!=='closed'&&(j+vi)%(i%3+2)!==1).map(x=>x.id),amounts:{},reserves:[{reason:['专项对象待定','市场机动支持','战略客户预留'][i%3],amount:Math.round(c.budget*(.08+i%4*.03))}],notes:{},method:(i%2?'C3':'Delivery Vol')+' · '+st.period,ack:true,status:'已提交',savedAt:'',changeReason:c.reason};d.amounts=allocate(c,d,i%2?'c3':'vol')||{};db.submissions[key(v.id,c.id)]={...clone(c),...clone(d),version:v.id,revision:1,submittedAt:'模拟提交'};db.drafts[key(v.id,c.id)]=clone(d);if(c.id==='INI-010')delete db.submissions[key(v.id,c.id)]}));st.version='202701';st.owner='王磊';st.ownerSector='B2B';st.ownerDept='MKT';log('进入V6组合演示沙盒，不写入原工作区')}

function moneyRows(){let c=currentConfig(),d=current();return [['版本','Initiative编码','经销商编码','经销商名称','分配金额（元）','调整说明'],...d.selected.map(id=>[st.version,c.id,id,SEED.dealers.find(x=>x.id===id).name,d.amounts[id]||0,d.notes[id]||''])]}
function rosterRows(){return [['经销商编码','经销商名称','SD','RSM','经销商状态'],...current().selected.map(id=>{let x=SEED.dealers.find(x=>x.id===id);return [x.id,x.name,x.sd,x.rsm,x.status]})]}
function checkMoney(rows){if(rows[0]?.join('|')!==moneyRows()[0].join('|'))throw Error('表头与金额模板不匹配');let c=currentConfig(),d=current(),seen=new Set(),amounts={},notes={};for(let [i,r] of rows.slice(1).entries()){if(String(r[0])!==st.version||String(r[1])!==c.id)throw Error('第'+(i+2)+'行：版本或Initiative不匹配');let id=String(r[2]),x=SEED.dealers.find(x=>x.id===id);if(!x||!d.selected.includes(id))throw Error('名单外编码 '+id);if(seen.has(id))throw Error('重复编码 '+id);if(String(r[3])!==x.name)throw Error('名称与底层库不一致 '+id);let n=Number(r[4]);if(String(r[4]).trim()===''||!Number.isSafeInteger(n)||n<0||n>10000000000)throw Error('金额须为非负整数元');seen.add(id);amounts[id]=n;notes[id]=String(r[5]||'').slice(0,160)}if(seen.size!==d.selected.length)throw Error('须上传完整名单，不能只上传修改行');return {amounts,notes}}
function checkRoster(rows){if(rows[0]?.join('|')!==rosterRows()[0].join('|'))throw Error('名单模板表头不匹配');let seen=new Set();for(let r of rows.slice(1)){let id=String(r[0]),x=SEED.dealers.find(x=>x.id===id);if(!x)throw Error('底层库不存在编码 '+id);if(seen.has(id))throw Error('重复编码 '+id);if([x.name,x.sd,x.rsm,x.status].join('|')!==r.slice(1,5).map(String).join('|'))throw Error('主数据属性不一致 '+id);seen.add(id)}if(!seen.size||seen.size>1000)throw Error('名单须为1–1000行');return [...seen]}
function backup(){download('ResourceStudio_V20_工作区备份.json',JSON.stringify({app:'ResourceStudioV20',db},null,2),'application/json')}
function validBackup(x){if(x?.app!=='ResourceStudioV20'||!x.db||!Array.isArray(x.db.versions)||!x.db.versions.length||x.db.versions.length>50||!x.db.drafts||!x.db.submissions||!Array.isArray(x.db.ledger)||!x.db.expected||!Array.isArray(x.db.audit))throw Error('不是有效V6备份');let ids=new Set();for(let v of x.db.versions){if(!/^20\d{2}(0[1-9]|1[0-2])$/.test(v.id)||ids.has(v.id)||!Array.isArray(v.catalog)||v.catalog.length>500||typeof v.name!=='string'||v.name.length>60)throw Error('版本无效');ids.add(v.id);let ci=new Set();for(let c of v.catalog){if(!/^INI-\d{3,6}$/.test(c.id)||ci.has(c.id)||!Number.isSafeInteger(c.budget)||c.budget<=0||c.budget>1e10||['name','sector','dept','owner','type','reason'].some(k=>typeof c[k]!=='string'||c[k].length>160))throw Error('项目配置无效');ci.add(c.id)}}for(let d of [...Object.values(x.db.drafts),...Object.values(x.db.submissions)]){if(!Array.isArray(d.selected)||new Set(d.selected).size!==d.selected.length||d.selected.some(id=>!SEED.dealers.some(x=>x.id===id))||!Array.isArray(d.reserves)||d.reserves.some(r=>!Number.isSafeInteger(r.amount)||r.amount<0||typeof r.reason!=='string')||Object.entries(d.amounts||{}).some(([id,n])=>!d.selected.includes(id)||!Number.isSafeInteger(n)||n<0))throw Error('草稿或提交无效')}let li=new Set();for(let l of x.db.ledger){if(typeof l.id!=='string'||li.has(l.id)||!Number.isSafeInteger(l.amount)||l.amount<0||![1,2,3,4].includes(l.q)||typeof l.note!=='string'||!['自动Tracking','手工补充'].includes(l.source))throw Error('费用无效');li.add(l.id)}return x.db}
function formError(e){if($('#formerror'))$('#formerror').textContent=e.message;else toast(e.message)}
function integer(value,allowZero=true){if(String(value).trim()==='')throw Error('金额不能为空');let n=Number(value);if(!Number.isSafeInteger(n)||n<(allowZero?0:1)||n>10000000000)throw Error('金额须为有效的'+(allowZero?'非负':'正')+'整数元，且不超过100亿元');return n}
function saveInit(){let name=$('#iname').value.trim(),budget=integer($('#ibudget').value,false),reason=$('#ireason').value.trim(),pre=$('#ipredecessor').value.trim();if(!name||!reason)throw Error('名称与变化原因必填');if(pre&&!db.versions.some(v=>v.catalog.some(c=>c.id===pre)))throw Error('承接项目编码不存在');let old=cat().find(c=>c.id===st.editInit),id=old?.id||'INI-'+String(Math.max(0,...db.versions.flatMap(v=>v.catalog).map(c=>Number(c.id.slice(4))))+1).padStart(3,'0');if(pre===id)throw Error('项目不能承接自己');let c={id,name,sector:$('#isector').value,dept:$('#idept').value,type:$('#itype').value,owner:$('#iowner').value,budget,enabled:$('#ienabled').value==='1',reason,predecessor:pre};if(old){let sub=submitted(st.version,id);if(sub){db.archives=db.archives||[];db.archives.push({reason:'配置变更撤回提交',snapshot:clone(sub)});delete db.submissions[key(st.version,id)]}Object.assign(old,c)}else cat().push(c);ver().published=false;log(st.version+' / '+id+' 配置变更：'+reason+'；需重新发布');persist();close();render();toast('已保存本版配置，重新发布后业务端可用')}
function saveVersion(){let id=$('#vid').value.trim(),name=$('#vname').value.trim(),base=$('#vbase').value;if(!/^20\d{2}(0[1-9]|1[0-2])$/.test(id)||!name)throw Error('请输入有效YYYYMM版本号和名称');if(ver(id))throw Error('版本号已存在');if(id<=base)throw Error('新版本号应晚于来源版本');let v={id,name,base,open:true,published:false,catalog:clone(cat(base))};db.versions.push(v);db.versions.sort((a,b)=>a.id.localeCompare(b.id));v.catalog.filter(c=>c.enabled).forEach(c=>{let s=submitted(base,c.id);if(s)db.drafts[key(id,c.id)]={selected:clone(s.selected),amounts:clone(s.amounts),reserves:clone(s.reserves),notes:clone(s.notes),method:s.method,ack:false,status:'待核对上版方案',savedAt:'',changeReason:''}});st.version=id;st.adminTab='catalog';log('从'+base+'创建'+id+'，复制提交为草稿，未自动提交');persist();close();render();toast('新版本已创建，请配置并发布')}
async function addDealer(id){let d=current(),x=SEED.dealers.find(x=>x.id===id);if(!x||d.selected.includes(id))return;if(x.status==='closed'&&!await studioConfirm('该经销商为closed，确认仍纳入本版范围？'))return;d.selected.push(id);d.amounts[id]=0;mark()}

function help(){modal('历史指标与红绿灯口径',`<div class="notice yellow">Yield口径：Actual C3 ÷ 历史投资总额，越高越好（只显示数值，不加倍数后缀；负值和缺失值显示“—”）。</div><h3>三类历史数据</h3><p>① 合同：合同签署Delivery Vol。② Actual：实际 Delivery Vol与C3。③ 历史投资：ICE rebate、MRD、SP&A、Capex，四项合计为投资总额。</p><h3>平均值与信号灯</h3><p>Phasing加权平均 = 范围实际 Delivery Vol合计 ÷ 有效合同量合计。Yield加权平均 = 有效C3合计 ÷ 有效历史投资合计。不平均经销商比率。</p><p>相对平均优于10%以上为绿，±10%为黄，差于10%以上为红；Phasing与Yield均越高越好。无有效分母为灰。投资金额占比差值仅做±2pp黄色提示，不给投入合理性打分。</p><h3>范围一致</h3><p>Owner单项表用该项目适用名单；Owner组合、部门和最高管理层表使用全量经销商历史，当前投入按相应项目/部门汇总。搜索、排序、分页不改变分母。</p><p>2026 YTD截至10月，Actual和投资为累计，合同为全年签署量。只与同一期间范围平均比较，不与2025全年直接判断同比。</p><div class="notice">全部为合成演示数据；角色切换不代表真实权限。本版只做预算拆分与投入分布分析。</div>`)}

   ===================================================================================== */

<script>

function closedByTime(v=ver()){return !!(v?.submitDeadline&&Date.now()>=Date.parse(v.submitDeadline))}

const validate18=validate;validate=function(c,d){let errors=validate18(c,d);if(closedByTime())errors.unshift('已到提交截止时间，请联系管理员');return errors.map(e=>e==='待分配金额须为0'?(pending(c,d)>0?'尚有 ¥ '+fmt(pending(c,d))+' 未分配':'超出预算 ¥ '+fmt(-pending(c,d)))+'；请调整金额或预留':e)};

<section><h3>期间与单位</h3><p>历史参考：2025 全年、${esc(PL('2026YTD'))}；当前规划：2027 拟议。2024 仅用于计算 2025 同比。切换历史期间只更新参考、试算权重及分析，不自动重算已分配金额；明细表期间可独立切换或与分析同步。</p><p>规划金额编辑单位元、展示单位万元；合同量、Delivery Vol 单位 KL；C3 与历史投资单位 K$。2026 Actual 与历史投资为截至配置月份的累计值；合同量为全年签署量，不直接与2025全年判断同比。</p></section>
<section><h3>预算与分配</h3><p>Owner 预算 = 已分配 + 预留 + 待分配；上级看板分别展示已分配、预留、未提交。预留不参与试算，不会因手工调整自动消耗。草稿可暂时不平，提交时预算差额须为0，正数表示未分配，负数表示超预算。</p><p>分配／名单表示获配家数／当前项目名单家数；分配／全部表示获配家数／该SD全部经销商家数。客均 = 投资金额 ÷ 获配家数。较试算 = 当前金额 − 最近采用试算金额，仅Owner可见；较上版 = 当前金额 − 来源版本已提交金额。</p></section>
<section><h3>集中度与叠加分析</h3><p>经销商按投资金额从高到低排序，Top 20%／50%／80% 表示对应比例的经销商家数；比较其获得的投资占比与贡献的产出占比。单项目以自己的名单为范围；资源大类按其项目名单并集；叠加分析按范围内各项目名单并集，历史数据去重。</p><p>无C3和Delivery Vol历史的新经销商不参与集中度比较，获配金额单独说明。差值 = 投资金额占比 − 当前产出占比；产出可切换C3或Delivery Vol。集中或超配是复核提示，不代表投资错误，也不代表因果ROI。</p><p>SD矩阵每格为项目投到该SD的金额占该项目已分配金额的比例，对照该SD在此项目名单内的产出占比；未覆盖不参与偏离判断。项目按最大偏离排序；资源大类内项目按最大集中度差值排序。</p></section>
<section><h3>明细范围与列视图</h3><p>工作台明细基于当前项目名单，组合看板明细以全量经销商为范围、金额为当前筛选范围内草稿或已提交方案的合计。搜索、点击分组、排序、分页和列视图只改变展示，不改变占比分母与加权平均。</p><p>点击经销商可查看资源构成、项目来源和两年历史；点击SD或项目名称可下钻。调整说明为选填业务原因，上级可见，不因缺少说明阻断提交。</p></section>
<section><h3>比率与阈值</h3><p>Phasing = 实际Delivery Vol ÷ 合同量；Yield = Actual C3 ÷ 历史投资总额。投资总额 = ICE Rebate + MRD + SP&amp;A + Capex。加权平均按有效分子、分母汇总后相除，不平均各家比率。无有效分母显示“—”。</p><p>Phasing、Yield相对加权平均优于10%为绿、±10%为黄、差于10%为红。集中度与SD差值：超过${T.gap[0]}pp建议复核，超过${T.gap[1]}pp优先关注；叠加后单家偏离：超过${T.dev[0]}pp建议复核，超过${T.dev[1]}pp优先关注。阈值由管理员统一配置。</p></section>
<section><h3>试算与版本比较</h3><p>三种试算使用同一名单、同一可分配金额，以历史Delivery Vol、C3或历史投资作为依据；采用后仍可微调，依据随提交保留。历史投资分配可能延续原有格局。</p><p>版本对比默认当前版本与其来源版本，可自选两个已发布版本。按稳定项目编码比较；未提交不等于预算减少。经销商投资变化仅比较两版均已提交的存续项目；调整量为逐家变化绝对值之和，不等于净增预算。</p></section>
<section><h3>配置与提交管理</h3><p>提交截止时间按北京时间设置，到期关闭修改与提交，历史查看、搜索与下载仍可用。配置变更若撤回本版提交，需要Owner重新提交和管理员重新发布；具体后果在保存时提示。</p><p>用户角色决定页面；部门负责人授权范围为Sector × Department。停用用户不能登录，负责项目需改派；用户账号沿用企业身份体系。</p></section></div>`)};
render();
</script>

  const drawerBounds=()=>({min:Math.min(560,Math.floor(innerWidth*.96)),max:Math.floor(innerWidth*.96)});

  window.addEventListener('change',async e=>{const id=e.target.dataset?.initiativeColor;if(!id||st.role!=='admin'||!/^#[0-9a-f]{6}$/i.test(e.target.value))return;e.stopImmediatePropagation();db.initiativeColors=db.initiativeColors||{};db.initiativeColors[id]=e.target.value;persist();toast('已保存 Initiative 图表颜色');},true);

  const oldCurve=curve;

    for(const row of tpl.content.querySelectorAll('tbody tr[data-p]')){
      const cell=row.firstElementChild,button=document.createElement('button');button.type='button';button.className='quiet small link concentration-table-link';button.dataset.concentration=key;button.dataset.concentrationP=row.dataset.p;button.textContent='Top '+row.dataset.p+'%';button.setAttribute('aria-label','查看 Top '+row.dataset.p+'% 经销商明细');cell.firstChild.replaceWith(button);

  function showDetails(key,p,trigger){

      <p class="cohort-bottom-note">所有条形共用金额刻度，条长比较获配总量，颜色区分 Initiative；悬停色块查看 Initiative、金额及其占该经销商投资的比例；点击经销商名称查看卡片。</p>
    </div>`;
    const existing=$('#layer .drawer');
    if(existing){parentDrawer={nodes:[...$('#layer').childNodes],curD,dStack:[...dStack],lastFocus,trigger,scroll:existing.scrollTop};}
    else parentDrawer=null;
    trigger?.focus?.({preventScroll:true});curD=null;dStack=[];
    modal(`Top ${p}% 经销商 · 集中度明细`,body,undefined,true);
    mountDimensions($('.cohort-detail'),context);
    if(parentDrawer){lastFocus=parentDrawer.lastFocus;const back=document.createElement('button');back.type='button';back.className='small backbtn';back.dataset.cohortBack='';back.textContent='← 返回上一层';$('#layer .drawer h2').parentElement.before(back);}

  function showSegment(segment){document.getElementById('cohort-segment-detail')?.remove();const pop=document.createElement('div');pop.id='cohort-segment-detail';pop.className='cohort-segment-detail';pop.setAttribute('role','status');pop.textContent=segment.dataset.sourceName+' · '+fmt(Number(segment.dataset.sourceAmount),2)+' 元 · 占该经销商 '+segment.dataset.sourceShare;document.body.append(pop);const r=segment.getBoundingClientRect(),p=pop.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(r.left,innerWidth-p.width-8))+'px';pop.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-p.height-8))+'px';}

      $('#layer').replaceChildren(...saved.nodes);curD=saved.curD;dStack=saved.dStack;lastFocus=saved.lastFocus;parentDrawer=saved.parentDrawer;activeContext=saved.activeContext;
      $('#layer .drawer').scrollTop=saved.scroll;$('#layer .cohort-tablewrap').scrollTop=saved.tableScroll;saved.trigger.focus({preventScroll:true});window.dispatchEvent(new Event('resize'));return;
    }

    e.preventDefault();e.stopImmediatePropagation();const focusTarget=trigger.matches('.concentration-label')?trigger.closest('svg').querySelector(`.concentration-point[data-concentration-p="${trigger.dataset.concentrationP}"]`):trigger;showDetails(trigger.dataset.concentration,Number(trigger.dataset.concentrationP),focusTarget);
  },true);
  window.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.concentration-point')){e.preventDefault();e.stopImmediatePropagation();showDetails(e.target.dataset.concentration,Number(e.target.dataset.concentrationP),e.target);}},true);
  const priorModal=modal;modal=function(...args){const result=priorModal(...args);applyInitiativeColors(document.getElementById('layer'));if(dealerParent&&$('#layer .drawer')&&!$('#layer .cohort-detail')){const back=document.createElement('button');back.type='button';back.className='small backbtn';back.dataset.cohortReturn='';back.textContent='← 返回集中度明细';$('#layer .drawer h2').parentElement.before(back);}return result;};
  window.addEventListener('scroll',()=>document.getElementById('cohort-segment-detail')?.remove(),true);
  window.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('cohort-segment-detail')?.remove();},true);

  const priorRender=render;render=function(){contexts.clear();syncTypeColors();const result=priorRender();syncTypeColors();colorSettings();dimensionSettings();applyInitiativeColors();return result;};
  render();

<script>
/* Prototype administration: staged catalog edits and explicit active role. */
(() => {
  const drafts=new Map();
  let simulationOrigin=null;
  const roles=u=>u.roles?.length?u.roles:[u.role];
  const scopeBefore=scopeConfig;scopeConfig=function(...args){if(st.role==='dept'&&!(curUser().scopes||[]).some(x=>x.sector===st.sector&&x.dept===st.dept))return [];return scopeBefore(...args);};
  const ensureBefore=ensureCfg;ensureCfg=function(){ensureBefore();owners.splice(0,owners.length,...db.users.filter(u=>u.active&&roles(u).includes('owner')).map(u=>u.name));};
  const userFormBefore=userForm;
  userForm=function(id){userFormBefore(id);const u=db.users.find(x=>x.id===id),selected=u?roles(u):['owner'],select=$('#urole');select.parentElement.hidden=true;select.parentElement.style.display='none';select.parentElement.insertAdjacentHTML('afterend',`<fieldset class="admin-role-picks"><legend>角色（Owner 与部门负责人可同时选择）</legend>${Object.entries(ROLE_NAME).map(([key,label])=>`<label><input type="checkbox" data-user-role="${key}" ${selected.includes(key)?'checked':''}>${label}</label>`).join('')}</fieldset>`);};
  saveUser=function(){
    const selected=$$('[data-user-role]:checked').map(x=>x.dataset.userRole),name=$('#uname').value.trim(),account=$('#uacct').value.trim(),active=$('#uactive').value==='1';
    const scopes=$$('[data-scope]:checked').map(x=>{const [sector,dept]=x.dataset.scope.split('|');return {sector,dept};});
    if(!name||!account)throw Error('姓名与登录账号必填');
    if(!selected.length)throw Error('请至少选择一个角色');
    if(selected.length>1&&selected.some(r=>!['owner','dept'].includes(r)))throw Error('多角色仅支持 Initiative Owner 与部门负责人组合');
    if(selected.includes('dept')&&!scopes.length)throw Error('部门负责人至少需要一个授权范围');
    if(db.users.some(u=>u.id!==st.editUser&&(u.account.toLowerCase()===account.toLowerCase()||u.name===name)))throw Error('姓名或账号已存在');
    let u=db.users.find(x=>x.id===st.editUser);
    if(u&&roles(u).includes('owner')&&u.name!==name)db.versions.forEach(v=>v.catalog.forEach(c=>{if(c.owner===u.name)c.owner=name;}));
    if(!u){u={id:'U'+String(Math.max(0,...db.users.map(x=>Number(x.id.slice(1))))+1).padStart(2,'0')};db.users.push(u);}
    Object.assign(u,{name,account,active,roles:selected,role:selected[0],scopes:selected.includes('dept')?scopes:[]});
    log('用户配置：'+name+' · '+selected.map(r=>ROLE_NAME[r]).join('、'));persist();close();render();toast('已保存用户配置');
  };
  function editCatalog(){if(!drafts.has(st.version))drafts.set(st.version,clone(cat()));render();}
  function catalogEditor(){
    if(st.adminTab!=='catalog')return;
    const rows=drafts.get(st.version),panel=$('#main [data-editinit]')?.closest('.panel');

    target.classList.add('admin-catalog-editor');target.innerHTML=`<div class="panelhead"><h2>本版项目配置 · 编辑中</h2><div class="row"><button data-catalog-cancel>取消修改</button><button data-catalog-add>新增 Initiative</button><button class="primary" data-catalog-save>统一保存</button></div></div><p class="cohort-unit-note">逐项修改后统一保存。业务配置发生变化的项目会撤回本版提交并存档，版本需重新发布。</p><div id="catalog-error" role="alert" class="negative"></div><div class="tablewrap"><table><thead><tr>${['编码 / 名称','Sector','部门','资源大类','Owner','预算（元）','状态','变化原因','承接编码'].map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td><small>${esc(r.id)}</small>${input(i,'name',r.name)}</td><td>${select(i,'sector',db.org.sectors.map(x=>[x,x]))}</td><td>${select(i,'dept',db.org.depts.map(x=>[x,x]))}</td><td>${select(i,'type',db.org.types.map(x=>[x,x]))}</td><td>${select(i,'owner',owners.map(x=>[x,x]))}</td><td>${input(i,'budget',r.budget,'number')}</td><td>${select(i,'enabled',[[true,'启用'],[false,'本版取消']])}</td><td>${input(i,'reason',r.reason)}</td><td>${input(i,'predecessor',r.predecessor)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function saveCatalog(){
    const rows=drafts.get(st.version);if(!rows)return;
    const fields=['name','sector','dept','type','owner','budget','enabled','reason','predecessor'];
    const changed=rows.filter(r=>{const old=cat().find(c=>c.id===r.id);return !old||fields.some(k=>(old[k]??'')!==(r[k]??''));});

    if(changed.length){ver().published=false;persist();}drafts.delete(st.version);render();toast(changed.length?'已统一保存，版本需重新发布':'没有需要保存的修改');

  function decorateAdmin(){
    if(st.role!=='admin')return;

      const idcell=button.closest('tr').insertCell(0);idcell.textContent=u.id;idcell.className='user-id-cell';cells[1].querySelector('.tiny')?.remove();
      const actions=document.createElement('div');actions.className='user-test-actions';actions.innerHTML=roles(u).map(r=>`<button type="button" class="small" data-simulate-user="${esc(u.id)}" data-simulate-role="${r}" ${u.active?'':'disabled'}>${u.active?'模拟进入':'已停用'}${roles(u).length>1?' · '+ROLE_NAME[r]:''}</button>`).join('');cells[7].append(actions);}
    if(st.adminTab==='users'){const header=$('#main .admin-users-table thead tr');if(header){const th=document.createElement('th');th.textContent='ID';header.prepend(th);}}
    catalogEditor();
  }
  const renderBefore=render;render=function(){const result=renderBefore();decorateAdmin();const available=roles(curUser());if(available.length>1){const select=document.createElement('select');select.dataset.activeRole='';select.setAttribute('aria-label','当前身份');select.innerHTML=available.map(r=>`<option value="${r}" ${r===st.role?'selected':''}>${ROLE_NAME[r]}</option>`).join('');const account=$('.nav-account');if(account){const group=document.createElement('div');group.className='account-role-group';account.replaceWith(group);group.append(account,select);}}simulationBanner();return result;};
  window.addEventListener('click',async e=>{
    const button=e.target.closest?.('[data-user-profile]');if(!button)return;e.preventDefault();e.stopImmediatePropagation();
    const u=curUser(),assigned=roles(u),scope=[];
    if(assigned.includes('owner'))scope.push('本人负责的 Initiative');
    if(assigned.includes('dept'))scope.push(...((u.scopes||[]).map(x=>x.sector+' / '+x.dept).length?(u.scopes||[]).map(x=>x.sector+' / '+x.dept):['部门范围未配置']));
    if(assigned.includes('exec'))scope.push('全部 Sector / 部门');if(assigned.includes('admin'))scope.push('系统配置');
    const admins=db.users.filter(x=>x.active&&roles(x).includes('admin'));
    const contacts=admins.length?admins.map(x=>`${esc(x.name)}（${esc(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.account||'')?x.account:'邮箱未配置')}）`).join('、'):'管理员联系方式尚未配置';
    modal('我的用户信息',`<div class="profile-details"><div><span>姓名</span><strong>${esc(u.name)}</strong></div><div><span>用户 ID</span><strong>${esc(u.id)}</strong></div><div><span>登录账号</span><strong>${esc(u.account||'未配置')}</strong></div><div><span>当前身份</span><strong>${esc(ROLE_NAME[st.role]||st.role)}</strong></div><div><span>拥有角色</span><strong>${assigned.map(r=>esc(ROLE_NAME[r]||r)).join('、')}</strong></div><div><span>授权范围</span><strong>${scope.map(esc).join('、')||'未配置'}</strong></div></div><div class="profile-contact">如需帮助，请联系管理员：${contacts}</div>`);
  },true);
  function simulationBanner(){
    $('#user-simulation-banner')?.remove();if(!simulationOrigin)return;
    const node=document.createElement('div');node.id='user-simulation-banner';node.className='user-simulation-banner';node.innerHTML=`<span>原型模拟：<b>${esc(curUser().name)}</b> · ${ROLE_NAME[st.role]}</span><button type="button" class="small" data-end-simulation>退出模拟，返回用户与权限</button>`;$('#protobar').append(node);

  window.addEventListener('click',async e=>{
    const end=e.target.closest?.('[data-end-simulation]');if(end&&simulationOrigin){e.preventDefault();e.stopImmediatePropagation();const origin=simulationOrigin;simulationOrigin=null;close();const admin=db.users.find(u=>u.id===origin.user&&u.active&&roles(u).includes('admin'));if(admin){applyPersona({...admin,role:'admin'});st.version=origin.version;st.adminTab='users';render();}return;}
    const b=e.target.closest?.('[data-simulate-user]');if(!b||st.role!=='admin')return;e.preventDefault();e.stopImmediatePropagation();const u=db.users.find(x=>x.id===b.dataset.simulateUser),role=b.dataset.simulateRole;if(!u?.active||!roles(u).includes(role))return;
    if(!simulationOrigin)simulationOrigin={user:st.user,version:st.version};applyPersona({...u,role});render();window.scrollTo(0,0);
  },true);
  window.addEventListener('change',async e=>{if(e.target.matches('[data-active-role]')){e.stopImmediatePropagation();const u=curUser();if(u.active&&roles(u).includes(e.target.value)){applyPersona({...u,role:e.target.value});render();}return;}},true);
  for(const event of ['input','change'])window.addEventListener(event,e=>{const k=e.target.dataset?.catalogField;if(!k||st.role!=='admin')return;e.stopImmediatePropagation();const row=drafts.get(st.version)?.[Number(e.target.dataset.catalogRow)];if(row)row[k]=k==='budget'?Number(String(e.target.value).replace(/[,，\s]/g,'')):k==='enabled'?e.target.value==='true':e.target.value;},true);

  document.addEventListener('click',async e=>{if(e.target.closest('[data-active-role]')){e.stopPropagation();return;}const b=e.target.closest('button');if(!b||st.role!=='admin')return;try{
    if(b.hasAttribute('data-catalog-edit'))editCatalog();
    else if(b.hasAttribute('data-catalog-cancel')){drafts.delete(st.version);render();}
    else if(b.hasAttribute('data-catalog-save'))saveCatalog();
    else if(b.hasAttribute('data-catalog-add')){const rows=drafts.get(st.version),n=Math.max(0,...db.versions.flatMap(v=>v.catalog).concat(rows).map(c=>Number(c.id.slice(4))));rows.push({id:'INI-'+String(n+1).padStart(3,'0'),name:'',sector:db.org.sectors[0],dept:db.org.depts[0],type:db.org.types[0],owner:owners[0],budget:1000000,enabled:true,reason:'',predecessor:''});render();}
  }catch(err){const box=$('#catalog-error');if(box)box.textContent=err.message;else toast(err.message);}},true);
  // Replace the old row edit/new entry points without keeping the oversized dialog.
  initForm=function(id){editCatalog();if(!id)$('#main [data-catalog-add]')?.click();};
  render();
})();

<script>
/* V19 prototype: submitted snapshots, department confirmation, carry-forward and reserve reasons.
   Integration: const submitted delegates to window.v19VisibleSubmitted when that helper exists. */
function v19RawSubmitted(v,id){return db.submissions[key(v,id)];}
function v19Confirmed(v,id){
  const s=v19RawSubmitted(v,id),a=s?.departmentConfirmation;
  return !!(a&&a.revision===s.revision&&!s.requiresResubmission);
}
window.v19VisibleSubmitted=function(v,id){
  const s=v19RawSubmitted(v,id);
  return st.role==='exec'&&(!ver(v)?.published||!v19Confirmed(v,id))?undefined:s;
};
(function(){
  const defaults=['专项对象待定','新品区域待定','战略客户预留','年末返利结算差异','区域策略待定','新市场待开发','市场机动支持','其他'];
  function ensure(){
    if(!db.org)db.org=clone(DEF_ORG);
    if(!Array.isArray(db.org.reserveReasons))db.org.reserveReasons=defaults.map(name=>({name,enabled:true}));
    db.org.reserveReasons=db.org.reserveReasons.map(r=>typeof r==='string'?{name:r,enabled:true}:r);
    if(!db.v19WorkflowInitialized){
      const open=db.versions.filter(v=>v.open&&v.published).sort((a,b)=>b.id.localeCompare(a.id));
      db.versions.forEach(v=>{v.open=!!open[0]&&v.id===open[0].id;});
      if(open[0])st.version=open[0].id;
      db.v19WorkflowInitialized=true;
    }
  }
  function now(){return new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});}
  function activeReasons(){ensure();return db.org.reserveReasons.filter(r=>r.enabled).map(r=>r.name);}
  function isAdmin(){return st.role==='admin';}
  function mayReview(sector,dept){return isAdmin()||(st.role==='dept'&&(curUser().scopes||[]).some(x=>x.sector===sector&&x.dept===dept));}
  function departmentItems(v=st.version,sector=st.sector,dept=st.dept){return cat(v).filter(c=>c.enabled&&c.sector===sector&&c.dept===dept);}
  function eligible(c,v=st.version){const s=v19RawSubmitted(v,c.id);return !!(s&&!s.requiresResubmission&&!v19Confirmed(v,c.id));}
  function state(c,v=st.version){const s=v19RawSubmitted(v,c.id);return v19Confirmed(v,c.id)?'已确认 · 只读':s?.requiresResubmission?'已退回 · 待重新提交':s?'已提交 · 待部门确认':'未提交';}
  function targetScope(v,sector,dept){return {version:v,sector,dept};}
  function confirmDialog(){
    if(st.role!=='dept'||!mayReview(st.sector,st.dept))return;
    const all=departmentItems(),pending=all.filter(c=>eligible(c)),missing=all.filter(c=>!v19RawSubmitted(st.version,c.id)||v19RawSubmitted(st.version,c.id)?.requiresResubmission);
    if(missing.length){toast('还有 '+missing.length+' 个 Initiative 未提交或已退回，请等待 Owner 全部提交后再统一确认');return;}
    if(!pending.length){toast('没有待确认的已提交方案');return;}
    st.v19ConfirmTarget={...targetScope(st.version,st.sector,st.dept),revisions:pending.map(c=>({id:c.id,revision:v19RawSubmitted(st.version,c.id).revision}))};
    const total=sum(pending.map(c=>allocated(v19RawSubmitted(st.version,c.id)))),res=sum(pending.map(c=>reserved(v19RawSubmitted(st.version,c.id))));
    modal('确认本部门已提交方案',`<p><b>${esc(st.version)} · ${esc(st.sector)} / ${esc(st.dept)}</b></p><p>本次确认 <b>${pending.length}</b> 个已提交 Initiative，确认后最高管理层可查看这批提交快照，Owner 将不能修改。</p><div class="v19-confirm-totals"><span>已分配 ¥ ${fmt(total)}</span><span>预留 ¥ ${fmt(res)}</span></div>${missing.length?`<div class="notice yellow">本部门另有 ${missing.length} 个 Initiative 未提交或待重新提交，不包含在本次确认中。</div>`:''}<div class="tablewrap"><table><thead><tr><th>Initiative / Owner</th><th>提交修订</th><th class="num">已分配（元）</th><th class="num">预留（元）</th></tr></thead><tbody>${pending.map(c=>{const s=v19RawSubmitted(st.version,c.id);return `<tr><td>${esc(c.name)}<div class="tiny">${esc(c.owner)}</div></td><td>V${s.revision}</td><td class="num">${fmt(allocated(s))}</td><td class="num">${fmt(reserved(s))}</td></tr>`;}).join('')}</tbody></table></div><p class="tiny">确认范围为本版本、当前部门全部待确认的已提交方案，不受页面 Initiative 筛选影响。如需修改，请先撤回部门确认，再按 Owner 退回开放修改。</p><div id="formerror" class="negative" role="alert"></div>`, '<button data-action="close">取消</button><button class="primary" data-v19-workflow="confirm">确认并向最高管理层开放</button>');
  }
  function confirmDepartment(){
    const t=st.v19ConfirmTarget;
