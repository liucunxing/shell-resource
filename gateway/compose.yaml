name: ${COMPOSE_PROJECT_NAME:-digitalshell-gateway}

services:
  nginx:
    image: ${GATEWAY_NGINX_IMAGE:-digitalshell-gateway:1.30.6-brotli1.2.1}
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    init: true
    environment:
      # Restrict envsubst so Nginx runtime variables such as $host are retained.
      NGINX_ENVSUBST_FILTER: ^(RESOURCE_UPSTREAM|ONEPORTAL_UPSTREAM)$
      RESOURCE_UPSTREAM: ${RESOURCE_UPSTREAM:-http://127.0.0.1:18080}
      ONEPORTAL_UPSTREAM: ${ONEPORTAL_UPSTREAM:-http://127.0.0.1:18081}
    volumes:
      - type: bind
        source: ./nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GATEWAY_CERTS_DIR:-./certs}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=8m,mode=0755
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, --header=Host:resource.digitalshell.com.cn, http://127.0.0.1/nginx-health]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Test templates and certificates before changing the live listener.
  nginx-check:
    extends:
      service: nginx
    profiles: [check]
    network_mode: none
    restart: "no"
    healthcheck:
      disable: true
