.block.required-focus{background:#fff4f1;border:1px solid #dc8a82;border-left:4px solid var(--red)}.block.required-focus h3{color:#96251f}.block.required-focus .status{background:#b52b25;color:white}.block.required-focus p{color:#753c35}.check-row{padding:7px 0}.check-row p{margin:2px 0 0;line-height:1.45}.check-row details{margin-top:2px}.check-row summary{padding:0;font-size:12px}.checks-grid{row-gap:0}.axis-heading{font-size:12px;line-height:1.5;color:#515b61;overflow-wrap:anywhere}.axis-heading.x{text-align:center;margin-top:4px}.plot text{font-size:12px}.quadrant-map{font-size:12px;color:#62686a;line-height:1.5;margin:7px 0}.plot-hit:focus-visible{outline:none;stroke:#0066b3;stroke-width:2}.plot-hit{cursor:pointer;fill:transparent}.plot-points{pointer-events:none}.check-row.required-check{border-left:3px solid var(--red);padding-left:8px}.check-row.required-check .status{background:#fff0ed;color:#96251f}
.bar-label strong,.legend-row .metric{font-size:16px}

<body>
<header class="lab"><div class="lab-header"><div><h1>Insight 能力包 · 离线预览</h1><p id="preview-origin">预置合成验收数据 · 人工编写结果 · 不调用模型</p></div><div class="lab-controls"><label for="scenario">预览场景</label><select id="scenario"></select><button id="expand" type="button" aria-pressed="false">展开阅读</button></div></div></header>
<main class="stage"><section class="panel" id="panel" aria-label="资源投资 Insight"><div class="panel-head"><div class="brand"><span class="spark" aria-hidden="true">✦</span>Insight</div><span class="quiet">资源投资分析</span></div><div class="scope" id="scope"></div><div class="preset"><label for="preset">分析方案</label><select id="preset"><option value="comprehensive">综合体检</option><option value="quadrant">Yield × 投入四象限</option><option value="structure">分配结构分析</option></select></div><div class="report" id="report" aria-live="polite"></div><footer class="stamp" id="stamp"></footer></section></main>
<script id="examples-data" type="application/json">__INSIGHT_EXAMPLES__</script>
<script>
'use strict';
(() => {
const examples=JSON.parse(document.getElementById('examples-data').textContent);
const DIMS={low_yield:'低 Yield 与计划投入',high_yield:'高 Yield 与计划投入',concentration:'投入集中度',overlap:'多项资源叠加',trend:'投入与业绩趋势',completeness:'预算完整性'};
const STATUS={review:'需关注',clear:'暂无突出事项',observed:'事实观察',limited:'依据不足'};
const COLORS=['#246a87','#7da4a5','#b5c8cb','#d8bd68','#9e9390','#c1c3c5'];
const scenario=document.getElementById('scenario'),preset=document.getElementById('preset'),report=document.getElementById('report');
let chartObservers=[];
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined&&text!==null)n.textContent=String(text);return n};
const unitLabel=u=>({CNY:'元',ratio:'%',multiple:'倍',count:'个'}[u]||u||'');
const fmt=(v,u='',suffix=false)=>{if(v===null||v===undefined)return '暂无数据';const n=typeof v==='number'?(u==='ratio'?v*100:v).toLocaleString('zh-CN',{maximumFractionDigits:2}):String(v);return n+(suffix&&u?' '+unitLabel(u):'')};
const badge=s=>el('span','status '+s,STATUS[s]);
const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
const finite=v=>typeof v==='number'&&Number.isFinite(v);
const unique=arr=>new Set(arr).size===arr.length;
function validate(e,r,presetConfig){
 assert(e&&r,'缺少当前方案的证据或结果');assert(e.schema_version==='1.0'&&r.schema_version==='1.0','不支持的数据版本');
 assert(r.preset_id===preset.value,'分析方案与结果不匹配');assert(Array.isArray(e.facts)&&Array.isArray(e.datasets),'证据格式无效');
 assert(Array.isArray(r.blocks)&&Array.isArray(r.checks)&&Array.isArray(r.limitations),'结果结构无效');
 assert(typeof r.headline==='string'&&typeof r.summary==='string','标题与摘要必须是文本');assert(r.limitations.every(x=>typeof x==='string'),'数据边界必须是文本');
 assert(unique(e.facts.map(x=>x.id))&&unique(e.datasets.map(x=>x.id)),'证据标识重复');
 assert(r.checks.length===6&&unique(r.checks.map(x=>x.dimension_id))&&r.checks.every(x=>DIMS[x.dimension_id]),'六维检查必须完整且唯一');
 assert(Array.isArray(e.check_constraints)&&e.check_constraints.length===6&&unique(e.check_constraints.map(x=>x.dimension_id))&&e.check_constraints.every(x=>DIMS[x.dimension_id]&&Array.isArray(x.allowed_statuses)&&x.allowed_statuses.length>0&&x.allowed_statuses.every(s=>STATUS[s])&&(x.required_focus===undefined||typeof x.required_focus==='boolean')),'证据必须提供六条唯一、完整的检查约束');
 assert(Array.isArray(presetConfig),'缺少分析方案配置');const config=presetConfig.find(x=>x.id===preset.value);assert(config&&Array.isArray(config.allowed_visuals),'缺少当前方案图表白名单');
 const facts=new Set(e.facts.map(x=>x.id)),sets=new Map(e.datasets.map(x=>[x.id,x]));
 for(const entry of [...r.blocks,...r.checks]){assert(STATUS[entry.status],'无效结论状态');assert(Array.isArray(entry.fact_ids)&&entry.fact_ids.every(x=>facts.has(x)),'结论引用了不存在的事实');if(entry.summary!==undefined)assert(typeof entry.summary==='string','检查摘要必须是文本');}
 for(const c of r.checks){const restriction=e.check_constraints.find(x=>x.dimension_id===c.dimension_id);assert(restriction.allowed_statuses.includes(c.status),'检查结论违反证据约束：'+DIMS[c.dimension_id]);if(restriction.required_focus){assert(c.status==='review','必须关注的检查项不能降级');assert(r.blocks.some(b=>b.status==='review'&&Array.isArray(b.dimension_ids)&&b.dimension_ids.includes(c.dimension_id)&&typeof b.body==='string'&&b.body.trim()),'必须关注的事项缺少正文说明：'+DIMS[c.dimension_id]);}}
 for(const b of r.blocks){assert(['finding','visual','note'].includes(b.kind),'未批准的内容组件');assert(typeof b.title==='string'&&typeof b.body==='string','内容必须是文本');assert(Array.isArray(b.dimension_ids)&&b.dimension_ids.every(x=>DIMS[x]),'内容引用未知维度');if(b.dataset_id){assert(sets.has(b.dataset_id),'图表引用不存在的数据集');assert(config.allowed_visuals.includes(sets.get(b.dataset_id).kind),'当前方案不允许此图表');validateDataset(sets.get(b.dataset_id),e,facts);}}
 return sets;
}
function validateDataset(d,e,facts){
 assert(d.scope_id===e.scope.id,'图表超出当前权限范围');assert(['comparison','ranked_bar','composition','quadrant','table'].includes(d.kind),'未批准的图表类型');assert(Array.isArray(d.rows)&&d.rows.length>0,'图表数据缺失，不能填零');assert(Array.isArray(d.fact_ids)&&d.fact_ids.every(x=>facts.has(x)),'图表引用未知事实');assert(unique(d.rows.map(x=>x.id)),'图表行标识重复');
 if(['comparison','ranked_bar','composition'].includes(d.kind))assert(d.rows.every(x=>finite(x.value)&&x.value>=0),'条形图必须提供非负数值');
 if(d.kind==='composition'){assert(finite(d.denominator)&&d.denominator>0,'构成图缺少有效分母');assert(Math.abs(d.rows.reduce((s,x)=>s+x.value,0)-d.denominator)<=.01,'构成金额未与分母对齐，不能展示100%分布');}
 if(d.kind==='quadrant'){assert(d.x&&d.y&&finite(d.x.cutoff)&&finite(d.y.cutoff),'四象限缺少数值分界');for(const axis of [d.x,d.y])assert(axis.label&&axis.unit&&axis.period&&['business','median'].includes(axis.cutoff_method),'四象限轴或分界方法不完整');assert(d.rows.every(x=>finite(x.x)&&finite(x.y)),'四象限坐标缺失，不能填零');assert(Number.isInteger(d.population_count)&&Number.isInteger(d.excluded_count)&&d.excluded_count>=0&&d.population_count===d.rows.length+d.excluded_count,'四象限样本数量无法对齐');assert(d.cohort_label&&d.cutoff_note,'四象限缺少比较范围或分界口径');}
 if(d.kind==='table')assert(Array.isArray(d.columns)&&d.columns.every(c=>c.key&&c.label),'表格缺少列定义');
}
function factsView(ids,e){const details=el('details');details.append(el('summary',null,'查看数据依据'));for(const id of [...new Set(ids)]){const f=e.facts.find(x=>x.id===id);if(!f)continue;const row=el('div','fact');row.append(el('b',null,f.label+'：'+fmt(f.value,f.unit,true)));row.append(el('div',null,[f.period,f.source,f.note].filter(Boolean).join(' · ')));details.append(row)}return details}
function table(columns,rows){const wrap=el('div','data-scroll'),t=el('table'),head=el('thead'),tr=el('tr');columns.forEach(c=>{const th=el('th',null,c.label+(c.unit?'（'+unitLabel(c.unit)+'）':''));th.scope='col';tr.append(th)});head.append(tr);t.append(head);const body=el('tbody');rows.forEach(r=>{const row=el('tr');columns.forEach(c=>row.append(el('td',null,fmt(r[c.key],c.unit))));body.append(row)});t.append(body);wrap.append(t);return wrap}
function chart(d,parentTitle){const wrap=el('div','chart');if(d.title!==parentTitle)wrap.append(el('div','chart-title',d.title));
 if(d.kind==='comparison'||d.kind==='ranked_bar'){const max=Math.max(...d.rows.map(r=>r.value),0);for(const r of d.rows){const row=el('div','bar-row'),label=el('div','bar-label');label.append(el('span',null,r.label),el('strong',null,fmt(r.value,d.unit,true)));row.append(label);const track=el('div','track'),fill=el('div','fill');fill.style.width=(max?r.value/max*100:0)+'%';track.append(fill);track.setAttribute('aria-hidden','true');row.append(track);wrap.append(row)}const axis=el('div','baseline');axis.append(el('span',null,'0'),el('span',null,fmt(max,d.unit,true)));wrap.append(axis);if(d.denominator)wrap.append(el('p','chart-note','占比分母：'+fmt(d.denominator,d.unit,true)));}
 if(d.kind==='composition'){const bar=el('div','composition');bar.setAttribute('aria-hidden','true');d.rows.forEach((r,i)=>{const s=el('span');s.style.width=r.value/d.denominator*100+'%';s.style.background=COLORS[i%COLORS.length];bar.append(s)});wrap.append(bar);d.rows.forEach((r,i)=>{const row=el('div','legend-row'),label=el('span','legend-label'),dot=el('span','dot');dot.style.background=COLORS[i%COLORS.length];label.append(dot,el('span',null,r.label));row.append(label,el('span','metric',(r.value/d.denominator*100).toFixed(1)+'%'));wrap.append(row);wrap.append(el('div','quiet',fmt(r.value,d.unit,true)))});wrap.append(el('p','chart-note','合计 / 占比分母：'+fmt(d.denominator,d.unit,true)+'；各项金额已对齐。'));}
 if(d.kind==='table')wrap.append(table(d.columns,d.rows));
 if(d.kind==='quadrant')wrap.append(quadrant(d));
 wrap.append(el('p','chart-note',[d.period,d.note].filter(Boolean).join(' · ')));return wrap;
}
function quadrant(d){
 const out=el('div'),NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');svg.classList.add('plot');svg.setAttribute('role','group');svg.setAttribute('aria-label',d.title+'。下方表格提供全部点的同等信息。');
 const valsX=d.rows.map(r=>r.x),valsY=d.rows.map(r=>r.y),minX=Math.min(0,...valsX,d.x.cutoff),minY=Math.min(0,...valsY,d.y.cutoff),maxX=Math.max(1,...valsX,d.x.cutoff)*1.08,maxY=Math.max(1,...valsY,d.y.cutoff)*1.08;
 const xScale=d.x.unit==='CNY'&&Math.max(Math.abs(minX),maxX)>=10000?10000:1,yScale=d.y.unit==='CNY'&&Math.max(Math.abs(minY),maxY)>=10000?10000:1;
 const xUnit=xScale===10000?'万元':unitLabel(d.x.unit),yUnit=yScale===10000?'万元':unitLabel(d.y.unit);
 const detail=el('div','selected-point','选择一个点查看数值；完整名单见下方。');
 out.append(el('div','axis-heading',d.y.period+' '+d.y.label+'（'+yUnit+'）'),svg,el('div','axis-heading x',d.x.period+' '+d.x.label+'（'+xUnit+'）'));
 out.append(el('div','quadrant-map','横向：Yield 由低到高；纵向：计划投入由低到高。四个象限仅表示两项指标的相对高低。'),detail);
 let lastWidth=0;
 const draw=()=>{const width=Math.min(670,Math.round(svg.getBoundingClientRect().width||out.clientWidth));if(width<100||width===lastWidth)return;lastWidth=width;svg.replaceChildren();const height=248,left=48,right=width-16,top=16,bottom=216;svg.setAttribute('viewBox','0 0 '+width+' '+height);svg.style.height=height+'px';
 const node=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;svg.append(n);return n};
 const x=v=>left+(v-minX)/(maxX-minX)*(right-left),y=v=>bottom-(v-minY)/(maxY-minY)*(bottom-top),cx=x(d.x.cutoff),cy=y(d.y.cutoff);
 node('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'#f7f9fa'});
 for(let i=0;i<=4;i++){const v=minY+(maxY-minY)*i/4;node('line',{x1:left,y1:y(v),x2:right,y2:y(v),stroke:'#e4e9eb'});node('text',{x:left-7,y:y(v)+4,'text-anchor':'end'},fmt(v/yScale,d.y.unit));}
 for(let i=0;i<=3;i++){const v=minX+(maxX-minX)*i/3;node('text',{x:x(v),y:bottom+21,'text-anchor':i===3?'end':i===0?'start':'middle'},fmt(v/xScale,d.x.unit));}
 node('line',{x1:cx,y1:top,x2:cx,y2:bottom,stroke:'#82949c','stroke-dasharray':'4 4'});node('line',{x1:left,y1:cy,x2:right,y2:cy,stroke:'#82949c','stroke-dasharray':'4 4'});
 for(const r of d.rows){const boundary=r.x===d.x.cutoff||r.y===d.y.cutoff,description=r.label+' · '+d.x.label+' '+fmt(r.x,d.x.unit,true)+' · '+d.y.label+' '+fmt(r.y,d.y.unit,true)+(boundary?' · 位于分界线上':'');node('circle',{cx:x(r.x),cy:y(r.y),r:5,fill:boundary?'#777e82':'#246a87',class:'plot-points'});const hit=node('circle',{cx:x(r.x),cy:y(r.y),r:14,tabindex:0,role:'button',class:'plot-hit','aria-label':description});const select=()=>{detail.textContent=description};hit.addEventListener('click',select);hit.addEventListener('focus',select);hit.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select()}});const title=document.createElementNS(NS,'title');title.textContent=description;hit.append(title);}

function render(){
 chartObservers.forEach(x=>x.disconnect());chartObservers=[];report.replaceChildren();document.getElementById('scope').textContent='';document.getElementById('stamp').textContent='';const example=examples.find(x=>x.id===scenario.value),e=example?.evidence,r=example?.results[preset.value];

}
