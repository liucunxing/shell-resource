 const checks=el('section','checks'),heading=el('h3','section-label');heading.append(el('span',null,'六维检查'),el('span','quiet','完整检查 · 按需展开'));checks.append(heading);const grid=el('div','checks-grid');for(const id of Object.keys(DIMS)){const c=r.checks.find(x=>x.dimension_id===id),row=el('div','check-row'+(required.has(id)?' required-check':'')),top=el('div','check-top');top.append(el('span',null,DIMS[id]),badge(c.status));row.append(top,el('p',null,c.summary));grid.append(row)}checks.append(grid);const checkFacts=r.checks.flatMap(c=>c.fact_ids);if(checkFacts.length){const details=factsView(checkFacts,e);details.querySelector('summary').textContent='查看六维检查的数据依据';checks.append(details)}report.append(checks);
 if(r.limitations.length){const limits=el('aside','limits');limits.append(el('strong',null,'数据边界'));const ul=el('ul');r.limitations.forEach(x=>ul.append(el('li',null,x)));limits.append(ul);report.append(limits)}
 }catch(error){const box=el('div','error');box.setAttribute('role','alert');box.append(el('h2',null,'这份分析暂不能展示'),el('p',null,error.message),el('p',null,'请核对结果结构与证据引用。预览不会推测缺失数据，也不会将其视为正常。'));report.append(box);}
}
function syncPresets(){const example=examples.find(x=>x.id===scenario.value),previous=preset.value,names={comprehensive:'综合体检',quadrant:'Yield × 投入四象限',structure:'分配结构分析'};preset.replaceChildren();Object.keys(example?.results||{}).forEach(id=>{const option=el('option',null,names[id]||id);option.value=id;preset.append(option)});if(Object.hasOwn(example?.results||{},previous))preset.value=previous;render()}
examples.forEach(x=>{const option=el('option',null,x.label);option.value=x.id;scenario.append(option)});scenario.addEventListener('change',syncPresets);preset.addEventListener('change',render);document.getElementById('expand').addEventListener('click',ev=>{const expanded=document.getElementById('panel').classList.toggle('expanded');ev.currentTarget.setAttribute('aria-pressed',String(expanded));ev.currentTarget.textContent=expanded?'返回侧栏':'展开阅读'});syncPresets();
})();
