# Copy to settings.toml and replace every placeholder with the real value.
# settings.toml is ignored by Git because it may contain credentials.
# Portal receiver is disabled by default in every profile. For a controlled rollout,
# inject RESOURCE_PORTAL_* environment variables (or uncomment these fields INSIDE
# the selected profile). Never change APP_ENV merely to enable this receiver.
# resource_portal_enabled = false
# resource_portal_issuer = "https://portal.example.invalid"
# resource_portal_origin = "https://resource.example.invalid"
# resource_portal_parent_origins = ["https://portal.example.invalid"]
# resource_portal_app_id = "resource-investment" # Plan C: actual managed_record.id
# resource_portal_audience = "resource-investment"
# resource_portal_kid = "resource-investment-01"
# resource_portal_key = "" # private standard Base64 of 32-128 random bytes
# resource_portal_cookie_secure = true
# resource_portal_cookie_samesite = "lax" # cross-site may need none + Secure
# resource_portal_allow_loopback_http = false # explicit local tests only
# resource_portal_session_ttl_seconds = 1800
# RESOURCE_PORTAL_PARENT_ORIGINS uses comma-separated canonical origins.

[development]
# FineReport direct exchange, for isolated UAT identities. See deploy/portal-email-login.md.
data_agent_base_url = ""
data_agent_api_token = ""
data_agent_ingress_key = ""
data_agent_space = "default"
data_agent_access_mode = "uat"
data_agent_uat_emails = []
app_name = "资源投资工作台"
app_version = "1.4.0"
debug = true
docs_enabled = true
api_v1_prefix = "/api/v1"
database_url = "postgresql+asyncpg://USER:ENCODED_PASSWORD@DEV_HOST:5432/DEV_DATABASE?ssl=require"
db_echo = true
cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
serve_frontend = true
# Copy the compatible-mode Base URL from your Bailian console.
ai_base_url = ""
ai_model = "qwen-plus"
ai_api_key = ""
ai_timeout_seconds = 60
insight_timeout_seconds = 60
# Review signals in CNY; not automatic approval/rejection rules.
insight_investment_increase_multiple = 2.0
insight_investment_decrease_multiple = 0.5
insight_investment_absolute_change = 50000
azure_blob_test_upload_enabled = true
azure_blob_account_url = "https://ACCOUNT_NAME.blob.core.chinacloudapi.cn"
azure_blob_account_key = "REPLACE_WITH_STORAGE_ACCOUNT_KEY"
azure_blob_container_name = "resource-dev"
azure_blob_max_upload_bytes = 20971520
# Set this after the workbench import template has been uploaded to the container.
azure_blob_workbench_template_name = ""
databricks_server_hostname = ""
databricks_http_path = ""
databricks_client_id = ""
databricks_client_secret = ""
databricks_view_name = "prod.resource_planning.dim_distributor"
databricks_timeout_seconds = 60
sso_enabled = false
sso_issuer = ""
sso_client_id = ""
sso_client_secret = ""

