# Copy to settings.toml and replace every placeholder with the real value.
# settings.toml is ignored by Git because it may contain credentials.

[development]
app_name = "资源投资工作台"
app_version = "1.4.0"
debug = true
docs_enabled = true
api_v1_prefix = "/api/v1"
database_url = "postgresql+asyncpg://USER:ENCODED_PASSWORD@DEV_HOST:5432/DEV_DATABASE?ssl=require"
db_echo = false
cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
serve_frontend = true
# Copy the compatible-mode Base URL from your Bailian console.
ai_base_url = ""
ai_model = "qwen-plus"
ai_api_key = ""
ai_timeout_seconds = 60
azure_blob_test_upload_enabled = true
azure_blob_account_url = "https://ACCOUNT_NAME.blob.core.chinacloudapi.cn"
azure_blob_account_key = "REPLACE_WITH_STORAGE_ACCOUNT_KEY"
azure_blob_container_name = "resource-dev"
azure_blob_max_upload_bytes = 20971520
# Set this after the workbench import template has been uploaded to the container.
azure_blob_workbench_template_name = ""
sso_enabled = false
sso_issuer = ""
sso_client_id = ""
sso_client_secret = ""

[production]
app_name = "资源投资工作台"
app_version = "1.4.0"
debug = false
docs_enabled = false
api_v1_prefix = "/api/v1"
database_url = "postgresql+asyncpg://USER:ENCODED_PASSWORD@PROD_HOST:5432/PROD_DATABASE?ssl=require"
db_echo = false
cors_origins = ["https://frontend.example.com"]
serve_frontend = true
ai_base_url = ""
ai_model = "qwen-plus"
ai_api_key = ""
ai_timeout_seconds = 60
azure_blob_test_upload_enabled = false
azure_blob_account_url = "https://ACCOUNT_NAME.blob.core.chinacloudapi.cn"
azure_blob_account_key = "REPLACE_WITH_PRODUCTION_STORAGE_CREDENTIAL"
azure_blob_container_name = "REPLACE_WITH_PRODUCTION_CONTAINER"
azure_blob_max_upload_bytes = 20971520
azure_blob_workbench_template_name = ""
sso_enabled = true
sso_issuer = "https://sso.example.com"
sso_client_id = "replace-me"
sso_client_secret = "replace-me"

[test]
serve_frontend = false
ai_base_url = "https://example.invalid/compatible-mode/v1"
ai_model = "qwen-plus"
ai_api_key = ""
ai_timeout_seconds = 5
app_name = "资源投资工作台 Test"
app_version = "1.4.0"
debug = false
docs_enabled = true
api_v1_prefix = "/api/v1"
database_url = "postgresql+asyncpg://USER:ENCODED_PASSWORD@TEST_HOST:5432/TEST_DATABASE?ssl=require"
db_echo = false
cors_origins = []
azure_blob_test_upload_enabled = true
azure_blob_account_url = "https://test-account.blob.core.chinacloudapi.cn"
azure_blob_account_key = "test-key"
azure_blob_container_name = "test-container"
azure_blob_max_upload_bytes = 20971520
azure_blob_workbench_template_name = "distributor-allocation-template.xlsx"
sso_enabled = false
sso_issuer = ""
sso_client_id = ""
sso_client_secret = ""
