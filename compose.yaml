name: ${COMPOSE_PROJECT_NAME:-shell-forecast}

services:
  app:
    image: shell-forecast:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${IMAGE_TAG:-local}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1/workbench}
        VITE_PLANNING_YEAR: ${VITE_PLANNING_YEAR:-2027}
        VITE_YIWEN_IFRAME_URL: ${VITE_YIWEN_IFRAME_URL:-}
    restart: unless-stopped
    init: true
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SETTINGS_FILE: /run/secrets/app_settings
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - source: app_settings
        target: app_settings
        uid: "${APP_UID:-10001}"
        gid: "${APP_GID:-10001}"
        mode: 0400
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-80}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

secrets:
  app_settings:
    file: ${APP_SETTINGS_SOURCE:-./deploy/settings.toml}
