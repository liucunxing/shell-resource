name: ${COMPOSE_PROJECT_NAME:-shell-forecast}

services:
  app:
    image: shell-forecast:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${IMAGE_TAG:-local}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1/workbench}
        VITE_PLANNING_YEAR: ${VITE_PLANNING_YEAR:-2027}
        VITE_YIWEN_IFRAME_URL: ${VITE_YIWEN_IFRAME_URL:-https://dataaitest.digitalshell.com.cn/}
    restart: unless-stopped
    init: true
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SETTINGS_FILE: /run/secrets/app_settings
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - source: app_settings
        target: app_settings
        uid: "${APP_UID:-10001}"
        gid: "${APP_GID:-10001}"
        mode: 0400
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-80}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30.5-alpine}
    profiles: [https]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-resource.digitalshell.com.cn}
      # Only replace this variable; preserve Nginx's $host/$request_uri etc.
      NGINX_ENVSUBST_FILTER: ^HTTPS_DOMAIN$
    ports:
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./deploy/nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
          selinux: z
      - type: bind
        source: ./deploy/certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/nginx-health]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  app_settings:
    file: ${APP_SETTINGS_SOURCE:-./deploy/settings.toml}
